# H2 en modo PostgreSQL: el mismo SQL de Flyway y de los lectores corre en las pruebas y en PostgreSQL.
spring.datasource.url=jdbc:h2:mem:cuentas;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;LOCK_TIMEOUT=3000;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.connection-init-sql=SET LOCK_TIMEOUT 3000
# La prueba de concurrencia lanza 20 hilos: el pool no puede ser el cuello de botella que la serialice.
spring.datasource.hikari.maximum-pool-size=30
banco.cuentas.sincronizar-al-iniciar=false
banco.cuentas.seguridad.bcrypt-fuerza=4
logging.level.root=WARN
logging.level.com.bancoxyz=WARN
eureka.client.enabled=false
spring.cloud.config.enabled=false
spring.kafka.listener.auto-startup=false
spring.kafka.admin.auto-create=false
banco.outbox.publicar=false
# Lo que en el ecosistema entrega el Config Server.
banco.jwt.emisor=https://localhost:8081
banco.jwt.audiencia=banco-xyz
banco.jwt.jwk-set-uri=https://localhost:8081/oauth2/jwks
banco.jwt.cache-jwks=30s
banco.kafka.particiones=3
resilience4j.circuitbreaker.configs.http-interno.sliding-window-size=6
resilience4j.circuitbreaker.configs.http-interno.minimum-number-of-calls=3
resilience4j.circuitbreaker.configs.http-interno.failure-rate-threshold=50
resilience4j.retry.configs.http-interno.max-attempts=2
resilience4j.retry.configs.http-interno.wait-duration=50ms
resilience4j.circuitbreaker.instances.clientes.base-config=http-interno
resilience4j.retry.instances.clientes.base-config=http-interno
resilience4j.bulkhead.instances.clientes.max-concurrent-calls=20
resilience4j.circuitbreaker.instances.kafka.sliding-window-size=4
resilience4j.retry.instances.kafka.max-attempts=3
resilience4j.circuitbreaker.instances.kafka.record-exceptions=com.bancoxyz.cuentas.outbox.ErrorDePublicacion
resilience4j.retry.instances.kafka.retry-exceptions=com.bancoxyz.cuentas.outbox.ErrorDePublicacion
