spring.application.name=bff-cajero
spring.config.import=optional:configserver:${BANCO_CONFIG_SERVER:http://127.0.0.1:8888}
server.port=8083
# HTTPS y mTLS hacia el core viven en el perfil tls (application-tls.properties), activo si no se elige otro.
# Las pruebas usan el perfil prueba.
spring.profiles.default=tls

# ---------------------------------------------------------------------------
# Backend principal. Timeouts del cliente HTTP: solo por propiedades, para que las pruebas
# puedan reemplazar el cliente por un simulador sin que el codigo pise la fabrica de conexiones.
# ---------------------------------------------------------------------------
# Direccion del core. Por defecto una URL fija (pruebas y arranque sin ecosistema). En el ecosistema el Config Server
# activa el descubrimiento y cambia la URL por el nombre del servicio: https://banco-core-api/api/v1, que el cliente
# resuelve en Eureka en cada llamada (config/DescubrimientoDelCore).
banco.core.url=https://localhost:8080/api/v1
banco.core.descubrimiento=false
banco.core.usuario=bff-cajero
banco.core.clave=${BANCO_CORE_CLAVE:cajero-secreto-dev}
spring.http.client.connect-timeout=1s
spring.http.client.read-timeout=5s
# Politica del circuito core. Rige la que entrega el Config Server (banco-xyz-cloud/configuracion/bff-cajero.properties);
# esta es su copia de respaldo, para que el BFF arranque protegido si el Config Server no responde. Deben decir lo
# mismo: lo comprueba banco-xyz-cloud/scripts/verificar_coherencia.sh.
resilience4j.circuitbreaker.instances.core.register-health-indicator=true
resilience4j.circuitbreaker.instances.core.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.core.sliding-window-size=6
resilience4j.circuitbreaker.instances.core.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.core.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.core.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.core.permitted-number-of-calls-in-half-open-state=2
# Los errores de negocio (4xx) y CUENTA_OCUPADA no abren el circuito; cualquier otro 5xx del core si cuenta.
resilience4j.circuitbreaker.instances.core.ignore-exception-predicate=com.bancoxyz.bff.cajero.core.ErrorDeNegocioDelCore
# Limite de tiempo del circuito por encima del read-timeout: quien corta es el cliente HTTP.
resilience4j.timelimiter.instances.core.timeout-duration=6s

# ---------------------------------------------------------------------------
# Canal cajero: secreto propio del token de sesion y terminales autorizados.
# Valores de desarrollo: en produccion se sobreescriben por variable de entorno.
# ---------------------------------------------------------------------------
banco.cajero.jwt.secreto=${BANCO_CAJERO_JWT_SECRETO:cajero-jwt-secreto-de-desarrollo-cambiar-en-prod-001}
banco.cajero.terminales[0].id=ATM-001
banco.cajero.terminales[0].secreto=${BANCO_ATM_001_SECRETO:atm-001-secreto-de-desarrollo-0123456789}
banco.cajero.terminales[0].ubicacion=Sucursal Centro
banco.cajero.terminales[1].id=ATM-002
banco.cajero.terminales[1].secreto=${BANCO_ATM_002_SECRETO:atm-002-secreto-de-desarrollo-9876543210}
banco.cajero.terminales[1].ubicacion=Sucursal Providencia
# Billetes de $1.000: es una regla del dispensador, no del dinero, por eso vive en este BFF.
banco.cajero.multiplo-billetes=1000
banco.cajero.maximo-por-retiro=200000
banco.cajero.ventana-firma-segundos=30
banco.cajero.sesion-segundos=120

# ---------------------------------------------------------------------------
# Optimizacion del canal cajero: respuestas minimas (menos de 250 bytes), sin nulos y SIN compresion: gzip sobre un
# cuerpo tan chico agrega CPU y encabezados sin ahorrar nada. La flota de terminales es acotada y conocida: pocos hilos.
# ---------------------------------------------------------------------------
server.compression.enabled=false
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=5
server.tomcat.accept-count=50
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

management.endpoints.web.exposure.include=health,info,circuitbreakers,circuitbreakerevents
springdoc.swagger-ui.path=/swagger-ui.html

eureka.client.service-url.defaultZone=${BANCO_EUREKA:http://127.0.0.1:8761/eureka/}
eureka.instance.hostname=localhost
eureka.instance.secure-port-enabled=true
eureka.instance.non-secure-port-enabled=false
eureka.instance.secure-port=${server.port}
eureka.instance.health-check-url=http://127.0.0.1:${management.server.port:9083}/actuator/health
eureka.instance.status-page-url=https://localhost:${server.port}/swagger-ui.html

logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5p) %clr([%-15.15t]){faint} %clr([%X{correlacion:-}]){magenta} %clr(%logger{0}){cyan} - %m%n
