# ---------------------------------------------------------------------------
# Perfil tls (activo por defecto): la misma configuracion segura en los tres BFF.
#   servidor      HTTPS con el certificado de bff-cajero, TLS 1.3/1.2, suites AEAD, HTTP/2.
#   cliente-core  mTLS hacia el core con el mismo certificado; solo se confia en la CA del banco.
# Los archivos los genera scripts/generar_certificados.sh (en produccion: PKI del banco o gestor de secretos).
# ---------------------------------------------------------------------------
banco.certificados=${BANCO_CERTIFICADOS:certificados}

server.ssl.bundle=servidor
server.http2.enabled=true
spring.ssl.bundle.pem.servidor.keystore.certificate=file:${banco.certificados}/servicios/bff-cajero.crt
spring.ssl.bundle.pem.servidor.keystore.private-key=file:${banco.certificados}/servicios/bff-cajero.key
spring.ssl.bundle.pem.servidor.options.enabled-protocols=TLSv1.3,TLSv1.2
spring.ssl.bundle.pem.servidor.options.ciphers=TLS_AES_256_GCM_SHA384,TLS_AES_128_GCM_SHA256,TLS_CHACHA20_POLY1305_SHA256,\
  TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256
# Los cajeros SI presentan certificado (uno por terminal, CN = id del terminal). want y no need: el rechazo lo
# responde FiltroCertificadoDeTerminal en el formato del cajero, en vez de un handshake cortado sin explicacion.
server.ssl.client-auth=want
spring.ssl.bundle.pem.servidor.truststore.certificate=file:${banco.certificados}/ca/ca.crt

# Hacia el core, igual que los otros BFF.
spring.ssl.bundle.pem.cliente-core.keystore.certificate=file:${banco.certificados}/servicios/bff-cajero.crt
spring.ssl.bundle.pem.cliente-core.keystore.private-key=file:${banco.certificados}/servicios/bff-cajero.key
spring.ssl.bundle.pem.cliente-core.truststore.certificate=file:${banco.certificados}/ca/ca.crt
spring.http.client.ssl.bundle=cliente-core

