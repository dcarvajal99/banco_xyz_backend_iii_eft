# HTTPS con el certificado del Config Server y certificado de cliente obligatorio, firmado por la CA del banco.
banco.certificados=${BANCO_CERTIFICADOS:certificados}
server.ssl.bundle=servidor
server.ssl.client-auth=need
spring.ssl.bundle.pem.servidor.keystore.certificate=file:${banco.certificados}/servicios/config-server.crt
spring.ssl.bundle.pem.servidor.keystore.private-key=file:${banco.certificados}/servicios/config-server.key
spring.ssl.bundle.pem.servidor.truststore.certificate=file:${banco.certificados}/ca/ca.crt
spring.ssl.bundle.pem.servidor.options.enabled-protocols=TLSv1.3,TLSv1.2
