spring.application.name=config-server
# Semana 7 (observacion del profesor): el Config Server ya no responde en claro. HTTPS con el certificado de la PKI del
# banco, certificado de cliente obligatorio (mTLS) y usuario y clave (Basic): la configuracion central y lo que contiene
# solo lo leen los servicios del banco que tienen las dos credenciales.
server.port=8888
server.address=127.0.0.1
spring.security.user.name=${BANCO_CONFIG_USUARIO:configuracion}
spring.security.user.password=${BANCO_CONFIG_CLAVE:config-secreto-dev}

# Backend native: los archivos viven en banco-xyz-cloud/configuracion/, versionados junto a la infraestructura.
# native: backend de archivos. tls: HTTPS + mTLS (application-tls.properties); las pruebas lo apagan.
spring.profiles.active=native,tls
spring.cloud.config.server.native.search-locations=${BANCO_CONFIGURACION:file:./configuracion}

# Health en un puerto de operacion aparte, solo loopback y sin TLS (lo usan los scripts para esperar el arranque).
management.server.port=9888
management.server.address=127.0.0.1
management.server.ssl.enabled=false
management.endpoints.web.exposure.include=health
logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5p){blue} %clr(%logger{0}){cyan} - %m%n
