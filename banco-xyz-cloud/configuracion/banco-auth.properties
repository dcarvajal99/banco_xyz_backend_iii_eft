info.app.nombre=banco-auth
info.app.configuracion=centralizada
info.app.rol=servidor-de-autorizacion-oauth2

# Vida del access token y periodo de gracia: una clave retirada sigue en el JWK Set hasta que vencen los tokens que firmo.
banco.auth.duracion-token=5m

# El core se busca por nombre en Eureka (LoadBalancer) para verificar usuario y clave del formulario de login.
banco.core.url=https://banco-core-api/api/v1
banco.core.descubrimiento=true

# Resilience4j: la llamada al core usa la politica compartida http-interno (application.properties).
resilience4j.circuitbreaker.instances.core.base-config=http-interno
resilience4j.retry.instances.core.base-config=http-interno
resilience4j.bulkhead.instances.core.base-config=http-interno
# Clave incorrecta, usuario bloqueado o rol no permitido son respuestas validas: no abren el circuito. Tampoco el
# bulkhead lleno: es exceso de llamadas propias, no una falla del core.
resilience4j.circuitbreaker.instances.core.ignore-exceptions=com.bancoxyz.auth.core.ErrorDeNegocioDelCore,\
  io.github.resilience4j.bulkhead.BulkheadFullException

# -----------------------------------------------------------------------------------------------------------------------
# OAuth2 Client: GitHub (inicio de sesion con identidad federada: "Ingresar con GitHub" en el login de banco-auth)
# -----------------------------------------------------------------------------------------------------------------------
# El client-id de la aplicacion OAuth registrada en GitHub llega por variable de entorno (archivo .env del compose). El
# client-secret NUNCA pasa por el Config Server: banco-auth lo recibe directo de su entorno
# (SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GITHUB_CLIENT_SECRET, ver docker-compose.yaml).
spring.security.oauth2.client.registration.github.client-id=${BANCO_GITHUB_CLIENT_ID:sin-configurar}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.github.client-name=GitHub
# Solo entran cuentas de GitHub vinculadas a un cliente del banco: id numerico de GitHub (no el login, que se puede
# cambiar) = usuario del banco. El core confirma en cada inicio de sesion que el usuario existe y no esta bloqueado.
# 113071563 = dcarvajal99
banco.auth.github.vinculos.113071563=diana.prince
