spring.application.name=eureka-server
# Infraestructura interna: solo loopback.
server.address=127.0.0.1
server.port=8761

# Sin perfil: nodo unico (lo usan las pruebas). El ecosistema levanta DOS nodos con los perfiles peer1 y peer2
# (application-peer1/peer2.properties), que se registran entre si y replican el catalogo.
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
# Sin autopreservacion y con desalojo rapido: en desarrollo interesa ver caer un servicio, no que Eureka lo conserve.
eureka.server.enable-self-preservation=false
eureka.server.eviction-interval-timer-in-ms=5000
# Sin la cache de solo lectura, el catalogo refleja altas y bajas al instante (por defecto se refresca cada 30 s).
eureka.server.use-read-only-response-cache=false
# Cliente con que cada nodo se registra en su peer: RestClient en vez de Jersey. Si su registro expira (por ejemplo, tras
# suspender el equipo), el peer responde 404 al latido con el JSON de error de Spring Boot; el cliente Jersey intenta leer
# ese cuerpo como InstanceInfo, falla con 400 y el nodo no vuelve a registrarse nunca (el panel lo muestra como replica no
# disponible). RestClient decide por el codigo 404 y se registra de nuevo, como los demas servicios.
eureka.client.jersey.enabled=false
eureka.client.restclient.enabled=true

management.endpoints.web.exposure.include=health
logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5p){blue} %clr(%logger{0}){cyan} - %m%n
