spring.application.name=antifraude-service
server.port=8083
# HTTPS vive en el perfil tls (application-tls.properties), activo por defecto. Las pruebas usan el perfil prueba.
spring.profiles.default=tls

# Config Server es opcional para que las pruebas unitarias y el desarrollo aislado sigan funcionando.
# Cuando el ecosistema esta arriba, esta importacion tiene precedencia sobre este archivo local.
# El Config Server responde solo por HTTPS y exige usuario y clave (Basic) mas el certificado del servicio.
spring.config.import=optional:configserver:${BANCO_CONFIG_SERVER:https://localhost:8888}
# Con el ecosistema arriba (scripts/levantar_servicios.sh exporta BANCO_CONFIG_FAIL_FAST=true) el servicio NO arranca si el
# Config Server lo rechaza: sin esto, una clave o un certificado mal puesto lo dejaria corriendo con los valores locales.
spring.cloud.config.fail-fast=${BANCO_CONFIG_FAIL_FAST:false}
spring.cloud.config.username=${BANCO_CONFIG_USUARIO:configuracion}
spring.cloud.config.password=${BANCO_CONFIG_CLAVE:config-secreto-dev}
spring.cloud.config.tls.enabled=true
spring.cloud.config.tls.trust-store=file:${BANCO_CERTIFICADOS:certificados}/ca/truststore.p12
spring.cloud.config.tls.trust-store-password=${BANCO_ALMACEN_CLAVE:almacen-dev}
spring.cloud.config.tls.key-store=file:${BANCO_CERTIFICADOS:certificados}/servicios/antifraude-service.p12
spring.cloud.config.tls.key-store-password=${BANCO_ALMACEN_CLAVE:almacen-dev}
spring.cloud.config.tls.key-password=${BANCO_ALMACEN_CLAVE:almacen-dev}

management.endpoints.web.exposure.include=health,info

# Registro HTTPS en Eureka. La salud se consulta por el puerto de operacion, que solo escucha en loopback.
# Dos nodos Eureka que se replican: si uno cae, el cliente sigue con el otro.
eureka.client.service-url.defaultZone=${BANCO_EUREKA:http://127.0.0.1:8761/eureka/,http://localhost:8762/eureka/}
eureka.instance.hostname=localhost
eureka.instance.secure-port-enabled=true
eureka.instance.non-secure-port-enabled=false
eureka.instance.secure-port=${server.port}
eureka.instance.health-check-url=http://127.0.0.1:${management.server.port:9083}/actuator/health

# ---------------------------------------------------------------------------
# Saga de transferencias sobre Kafka (el Config Server entrega lo comun; esto es el respaldo local).
# ---------------------------------------------------------------------------
spring.kafka.bootstrap-servers=${BANCO_KAFKA:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# acks=all + idempotencia: el broker confirma solo lo que quedo escrito, sin duplicar por reintentos del productor.
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
# Fallar rapido si Kafka no esta: el manejador de errores decide cuanto insistir, no el productor bloqueado 60 s.
spring.kafka.producer.properties.max.block.ms=2000
spring.kafka.producer.properties.request.timeout.ms=2000
spring.kafka.producer.properties.delivery.timeout.ms=5000
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=record
# Un consumidor por instancia: antifraude escala agregando instancias (horizontal). Kafka reparte las 3 particiones
# entre las instancias del grupo; con mas instancias que particiones, las sobrantes quedan de reserva sin trabajo.
spring.kafka.listener.concurrency=1
# Cada instancia se identifica en Kafka por el nombre de su contenedor (en Docker, HOSTNAME) o por su puerto fuera de el:
# kafka-consumer-groups muestra que instancia tiene cada particion.
spring.kafka.client-id=${spring.application.name}-${HOSTNAME:${server.port}}
# Si una instancia muere sin avisar, a los 10 s Kafka la da por caida y reparte sus particiones (por defecto, 45 s).
spring.kafka.consumer.properties.session.timeout.ms=10000
banco.kafka.particiones=3

# ---------------------------------------------------------------------------
# Reglas de riesgo. El Config Server las entrega centralizadas (banco-xyz-cloud/configuracion/antifraude-service.properties);
# estos son los valores locales por defecto para correr el servicio aislado o en las pruebas.
# ---------------------------------------------------------------------------
banco.antifraude.monto-maximo=500000
banco.antifraude.cuentas-en-observacion=
# Tiempo que simula la consulta a un modelo de riesgo por evento (la medicion de escalabilidad lo usa).
banco.antifraude.demora-ms=0

logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5p) %clr([%-15.15t]){faint} %clr(%logger{0}){cyan} - %m%n
