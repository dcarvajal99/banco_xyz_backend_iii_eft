# ---------------------------------------------------------------------------
# Perfil tls (activo por defecto): HTTPS con el certificado del servicio.
# Los archivos los genera banco-xyz-cloud/scripts/generar_certificados.sh (PKI de desarrollo). En produccion vienen de
# la PKI del banco o de un gestor de secretos, montados con la misma estructura en BANCO_CERTIFICADOS.
# ---------------------------------------------------------------------------
banco.certificados=${BANCO_CERTIFICADOS:certificados}

server.ssl.bundle=servidor
server.http2.enabled=true

spring.ssl.bundle.pem.servidor.keystore.certificate=file:${banco.certificados}/servicios/antifraude-service.crt
spring.ssl.bundle.pem.servidor.keystore.private-key=file:${banco.certificados}/servicios/antifraude-service.key
# Unica confianza: la CA del banco, no el almacen de CA publicas de Java. No hace falta certificado de cliente: este
# servicio no expone una API que llamen otros servicios, solo su salud para Eureka.
spring.ssl.bundle.pem.servidor.truststore.certificate=file:${banco.certificados}/ca/ca.crt
# TLS 1.3 y 1.2 con suites AEAD y ECDHE (secreto perfecto hacia adelante). TLS 1.0/1.1 y CBC quedan fuera.
spring.ssl.bundle.pem.servidor.options.enabled-protocols=TLSv1.3,TLSv1.2
spring.ssl.bundle.pem.servidor.options.ciphers=TLS_AES_256_GCM_SHA384,TLS_AES_128_GCM_SHA256,TLS_CHACHA20_POLY1305_SHA256,\
  TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256

# Operacion (health y metricas) en un puerto aparte, solo en loopback y sin TLS: no se publica hacia afuera.
management.server.port=9083
management.server.address=127.0.0.1
management.server.ssl.enabled=false
management.endpoints.web.exposure.include=health,info,metrics
