# Banco XYZ en la nube: todo el ecosistema en contenedores con un solo comando.
#
#   docker compose up -d --build        construye las imagenes desde el codigo y levanta todo en orden
#   docker compose ps                   estado y salud de cada contenedor
#   docker compose up -d --scale antifraude-service=3   tres instancias de antifraude en el mismo grupo de Kafka
#   docker compose down                 detiene todo (los volumenes de datos, Kafka y certificados se conservan)
#
# Orden de arranque (depends_on por salud): pki -> db y kafka -> config-server -> eureka-1 y eureka-2 -> banco-core-api
# -> banco-auth, transferencias-service, antifraude-service y notificaciones-service.
# Secretos: por variable de entorno o archivo .env (ver .env.ejemplo). Los valores por defecto son solo de desarrollo.

name: banco-xyz

x-java: &java
  restart: unless-stopped
  networks: [banco]
  volumes:
    - certificados:/certificados:ro

x-entorno: &entorno
  # Perfil tls (HTTPS) y nube (configuracion de este entorno en el Config Server).
  SPRING_PROFILES_ACTIVE: tls,nube
  BANCO_CERTIFICADOS: /certificados
  BANCO_CONFIG_SERVER: https://config-server:8888
  BANCO_CONFIG_USUARIO: ${BANCO_CONFIG_USUARIO:-configuracion}
  BANCO_CONFIG_CLAVE: ${BANCO_CONFIG_CLAVE:-config-secreto-dev}
  BANCO_ALMACEN_CLAVE: ${BANCO_ALMACEN_CLAVE:-almacen-dev}
  # Si el Config Server rechaza a un servicio, el servicio no arranca (no corre con los valores de su jar).
  BANCO_CONFIG_FAIL_FAST: "true"

x-listo: &listo
  condition: service_healthy

services:

  # ---------------------------------------------------------------------------------------------------- infraestructura
  pki:
    build: { context: banco-xyz-cloud, dockerfile: docker/pki/Dockerfile }
    image: banco-xyz/pki:1.0.0
    environment:
      BANCO_ALMACEN_CLAVE: ${BANCO_ALMACEN_CLAVE:-almacen-dev}
    volumes:
      - certificados:/certificados
    restart: "no"
    networks: [banco]

  db:
    build: { context: banco-xyz-cloud, dockerfile: docker/db/Dockerfile }
    image: banco-xyz/db:1.0.0
    environment:
      POSTGRES_DB: banco_xyz
      POSTGRES_USER: ${BANCO_DB_USUARIO:-banco}
      POSTGRES_PASSWORD: ${BANCO_DB_CLAVE:-banco123}
    volumes:
      - datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d banco_xyz"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    mem_limit: 256m
    networks: [banco]

  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    environment:
      # Un nodo KRaft (broker y controlador, sin ZooKeeper), anunciado con su nombre en la red del compose.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      # Los topicos los crea cada servicio con sus particiones: un nombre mal escrito falla en vez de crear otro.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xmx384m -Xms384m
      # Datos en el volumen (la imagen los deja por defecto en /tmp: se perderian al recrear el contenedor).
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka:/var/lib/kafka/data
    healthcheck:
      # La herramienta corre dentro del contenedor del broker: con un heap pequeno, no los 384 MB que heredaria de
      # KAFKA_HEAP_OPTS (comparte el limite de memoria del contenedor con el broker).
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS='-Xms16m -Xmx64m' /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
    restart: unless-stopped
    mem_limit: 768m
    networks: [banco]

  config-server:
    <<: *java
    build: { context: banco-xyz-cloud, dockerfile: config-server/Dockerfile }
    image: banco-xyz/config-server:1.0.0
    hostname: config-server
    environment:
      BANCO_CONFIG_USUARIO: ${BANCO_CONFIG_USUARIO:-configuracion}
      BANCO_CONFIG_CLAVE: ${BANCO_CONFIG_CLAVE:-config-secreto-dev}
    depends_on:
      pki: { condition: service_completed_successfully }
    ports:
      - "127.0.0.1:8888:8888"
    mem_limit: 320m

  eureka-1:
    <<: *java
    build: { context: banco-xyz-cloud, dockerfile: eureka-server/Dockerfile }
    image: banco-xyz/eureka-server:1.0.0
    hostname: eureka-1
    environment:
      SPRING_PROFILES_ACTIVE: nube-peer1
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8761/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      start_period: 60s
      retries: 6
    ports:
      - "127.0.0.1:8761:8761"
    mem_limit: 320m

  eureka-2:
    <<: *java
    image: banco-xyz/eureka-server:1.0.0
    hostname: eureka-2
    depends_on:
      eureka-1: { condition: service_started }
    environment:
      SPRING_PROFILES_ACTIVE: nube-peer2
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8762/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      start_period: 60s
      retries: 6
    ports:
      - "127.0.0.1:8762:8762"
    mem_limit: 320m

  # ----------------------------------------------------------------------------------------------------- microservicios
  banco-core-api:
    <<: *java
    build: banco-core-api
    image: banco-xyz/banco-core-api:1.0.0
    hostname: banco-core-api
    environment:
      <<: *entorno
      EUREKA_INSTANCE_HOSTNAME: banco-core-api
      BANCO_DB_USUARIO: ${BANCO_DB_USUARIO:-banco}
      BANCO_DB_CLAVE: ${BANCO_DB_CLAVE:-banco123}
      BANCO_CANAL_AUTENTICACION_CLAVE: ${BANCO_CANAL_AUTENTICACION_CLAVE:-autenticacion-secreto-dev}
    depends_on:
      db: *listo
      kafka: *listo
      config-server: *listo
      eureka-1: *listo
    ports:
      - "127.0.0.1:9080:9080"
    mem_limit: 640m

  banco-auth:
    <<: *java
    build: banco-auth
    image: banco-xyz/banco-auth:1.0.0
    hostname: banco-auth
    environment:
      <<: *entorno
      EUREKA_INSTANCE_HOSTNAME: banco-auth
      BANCO_CANAL_AUTENTICACION_CLAVE: ${BANCO_CANAL_AUTENTICACION_CLAVE:-autenticacion-secreto-dev}
      BANCO_OAUTH_BANCA_WEB_SECRETO: ${BANCO_OAUTH_BANCA_WEB_SECRETO:-banca-web-secreto-dev}
      BANCO_OAUTH_TRANSFERENCIAS_SECRETO: ${BANCO_OAUTH_TRANSFERENCIAS_SECRETO:-transferencias-oauth-dev}
      BANCO_OAUTH_OPERACION_SECRETO: ${BANCO_OAUTH_OPERACION_SECRETO:-operacion-secreto-dev}
      # Inicio de sesion con GitHub: client-id (el Config Server lo usa en el registro) y secreto, que va directo a la
      # propiedad del cliente OAuth sin pasar por el Config Server. Sin .env, GitHub queda sin configurar (solo formulario).
      BANCO_GITHUB_CLIENT_ID: ${BANCO_GITHUB_CLIENT_ID:-sin-configurar}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GITHUB_CLIENT_SECRET: ${BANCO_GITHUB_CLIENT_SECRET:-sin-configurar}
      # Vinculos adicionales cuenta de GitHub -> cliente del banco (id=usuario,id=usuario), para probar con otra cuenta.
      BANCO_GITHUB_VINCULOS: ${BANCO_GITHUB_VINCULOS:-}
    depends_on:
      config-server: *listo
      eureka-1: *listo
      banco-core-api: *listo
    ports:
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:9081:9081"
    mem_limit: 448m

  transferencias-service:
    <<: *java
    build: transferencias-service
    image: banco-xyz/transferencias-service:1.0.0
    hostname: transferencias-service
    environment:
      <<: *entorno
      EUREKA_INSTANCE_HOSTNAME: transferencias-service
      BANCO_DB_USUARIO: ${BANCO_DB_USUARIO:-banco}
      BANCO_DB_CLAVE: ${BANCO_DB_CLAVE:-banco123}
      BANCO_OAUTH_TRANSFERENCIAS_SECRETO: ${BANCO_OAUTH_TRANSFERENCIAS_SECRETO:-transferencias-oauth-dev}
    depends_on:
      db: *listo
      kafka: *listo
      config-server: *listo
      banco-core-api: *listo
      banco-auth: *listo
    ports:
      - "127.0.0.1:8082:8082"
      - "127.0.0.1:9082:9082"
    mem_limit: 512m

  antifraude-service:
    <<: *java
    build: antifraude-service
    image: banco-xyz/antifraude-service:1.0.0
    # Sin hostname ni puertos publicados: se escala con --scale y cada instancia se registra con su IP.
    environment:
      <<: *entorno
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      kafka: *listo
      config-server: *listo
      eureka-1: *listo
    mem_limit: 384m

  notificaciones-service:
    <<: *java
    build: notificaciones-service
    image: banco-xyz/notificaciones-service:1.0.0
    hostname: notificaciones-service
    environment:
      <<: *entorno
      EUREKA_INSTANCE_HOSTNAME: notificaciones-service
    depends_on:
      kafka: *listo
      config-server: *listo
      eureka-1: *listo
    ports:
      - "127.0.0.1:8084:8084"
      - "127.0.0.1:9084:9084"
    mem_limit: 384m

networks:
  banco:
    name: banco-xyz

volumes:
  certificados:
  datos:
  kafka:
