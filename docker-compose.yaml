# Banco XYZ - EFT: el ecosistema completo en contenedores con un solo comando.
#
#   docker compose up -d --build --wait            construye las 10 aplicaciones desde el codigo y levanta todo en orden
#   docker compose ps                              estado y salud de cada contenedor
#   docker compose up -d --scale cuentas-service=2 --scale pagos-service=2 --scale clientes-service=2   escalar
#   docker compose down                            detiene todo (down -v borra base, Kafka y certificados)
#
# Orden (depends_on por salud): pki -> db, kafka -> config-server -> eureka-1/2 -> banco-xyz-batch (carga y termina)
# -> banco-auth, clientes-service, cuentas-service, pagos-service -> bff-web, bff-movil, bff-cajero.
# Hacia el equipo solo se publican, en 127.0.0.1, la entrada de cada canal (BFF), el login (banco-auth) y las consolas
# de infraestructura. Los microservicios no publican puertos: viven en la red interna (y por eso se pueden escalar).
# Secretos: archivo .env (ver .env.ejemplo). Los valores por defecto son solo de desarrollo.

name: banco-xyz

x-java: &java
  restart: unless-stopped
  networks: [banco]
  volumes:
    - certificados:/certificados:ro

x-entorno: &entorno
  # HTTPS (perfil tls) y la configuracion del entorno en contenedores (perfil nube del Config Server).
  SPRING_PROFILES_ACTIVE: tls,nube
  BANCO_CERTIFICADOS: /certificados
  BANCO_CONFIG_SERVER: https://config-server:8888
  BANCO_CONFIG_USUARIO: ${BANCO_CONFIG_USUARIO:-configuracion}
  BANCO_CONFIG_CLAVE: ${BANCO_CONFIG_CLAVE:-config-secreto-dev}
  BANCO_ALMACEN_CLAVE: ${BANCO_ALMACEN_CLAVE:-almacen-dev}
  # Si el Config Server rechaza al servicio, el servicio no arranca (no corre con valores incompletos).
  BANCO_CONFIG_FAIL_FAST: "true"
  BANCO_DB_USUARIO: ${BANCO_DB_USUARIO:-banco}
  BANCO_DB_CLAVE: ${BANCO_DB_CLAVE:-banco123}

x-listo: &listo
  condition: service_healthy

x-infraestructura: &infraestructura
  config-server: *listo
  eureka-1: *listo

services:

  # ---------------------------------------------------------------------------------------------------- infraestructura
  pki:
    build: { context: infra, dockerfile: docker/pki/Dockerfile }
    image: banco-xyz/pki:1.0.0
    environment:
      BANCO_ALMACEN_CLAVE: ${BANCO_ALMACEN_CLAVE:-almacen-dev}
    volumes:
      - certificados:/certificados
    restart: "no"
    networks: [banco]

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: banco_xyz
      POSTGRES_USER: ${BANCO_DB_USUARIO:-banco}
      POSTGRES_PASSWORD: ${BANCO_DB_CLAVE:-banco123}
    volumes:
      - datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d banco_xyz"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Solo en el equipo, para inspeccionar los esquemas (clientes, cuentas, pagos, migracion).
    ports:
      - "127.0.0.1:5439:5432"
    restart: unless-stopped
    mem_limit: 384m
    networks: [banco]

  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    environment:
      # Un nodo KRaft (broker y controlador, sin ZooKeeper), anunciado con su nombre en la red del compose.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      # Los topicos los crea cada servicio con sus particiones: un nombre mal escrito falla en vez de crear otro.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xmx384m -Xms384m
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS='-Xms16m -Xmx64m' /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
    restart: unless-stopped
    mem_limit: 768m
    networks: [banco]

  config-server:
    <<: *java
    build: config-server
    image: banco-xyz/config-server:1.0.0
    hostname: config-server
    environment:
      BANCO_CONFIG_USUARIO: ${BANCO_CONFIG_USUARIO:-configuracion}
      BANCO_CONFIG_CLAVE: ${BANCO_CONFIG_CLAVE:-config-secreto-dev}
    depends_on:
      pki: { condition: service_completed_successfully }
    ports:
      - "127.0.0.1:8888:8888"
    mem_limit: 320m

  eureka-1:
    <<: *java
    build: eureka-server
    image: banco-xyz/eureka-server:1.0.0
    hostname: eureka-1
    environment:
      SPRING_PROFILES_ACTIVE: nube-peer1
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8761/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      start_period: 60s
      retries: 6
    ports:
      - "127.0.0.1:8761:8761"
    mem_limit: 320m

  eureka-2:
    <<: *java
    image: banco-xyz/eureka-server:1.0.0
    hostname: eureka-2
    depends_on:
      eureka-1: { condition: service_started }
    environment:
      SPRING_PROFILES_ACTIVE: nube-peer2
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8762/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      start_period: 60s
      retries: 6
    ports:
      - "127.0.0.1:8762:8762"
    mem_limit: 320m

  # ----------------------------------------------------------------------------------------------------- capa de datos
  # Contenedor de UNA ejecucion: migra fin_legacy_data (semana_3) y termina. Con 40,7 % de filas sucias el decisor
  # derivaria la corrida a revision manual (codigo 3); el umbral de contingencia 0,80 lo autoriza el area de datos.
  # Volver a levantarlo no migra dos veces (la corrida "carga-inicial" ya termino COMPLETED).
  banco-xyz-batch:
    build: banco-xyz-batch
    image: banco-xyz/banco-xyz-batch:1.0.0
    command: ["--job=completa", "--dataset=semana_3", "--salida=salida", "--corrida=carga-inicial",
              "--banco.batch.umbral-rechazo-omision=0.80"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/banco_xyz
      BANCO_DB_USUARIO: ${BANCO_DB_USUARIO:-banco}
      BANCO_DB_CLAVE: ${BANCO_DB_CLAVE:-banco123}
    volumes:
      - salida-batch:/app/salida
    depends_on:
      db: *listo
    restart: "no"
    mem_limit: 768m
    networks: [banco]

  # ----------------------------------------------------------------------------------------------- servidor de identidad
  banco-auth:
    <<: *java
    build: banco-auth
    image: banco-xyz/banco-auth:1.0.0
    hostname: banco-auth
    environment:
      <<: *entorno
      BANCO_CANAL_AUTENTICACION_CLAVE: ${BANCO_CANAL_AUTENTICACION_CLAVE:-autenticacion-secreto-dev}
      BANCO_OAUTH_BFF_WEB_SECRETO: ${BANCO_OAUTH_BFF_WEB_SECRETO:-bff-web-secreto-dev}
      BANCO_OAUTH_BFF_CAJERO_SECRETO: ${BANCO_OAUTH_BFF_CAJERO_SECRETO:-bff-cajero-oauth-dev}
      BANCO_OAUTH_PAGOS_SECRETO: ${BANCO_OAUTH_PAGOS_SECRETO:-pagos-oauth-dev}
      BANCO_OAUTH_CUENTAS_SECRETO: ${BANCO_OAUTH_CUENTAS_SECRETO:-cuentas-oauth-dev}
      BANCO_OAUTH_OPERACION_SECRETO: ${BANCO_OAUTH_OPERACION_SECRETO:-operacion-secreto-dev}
      # Ingresar con GitHub: client-id (pasa por el Config Server) y secreto (directo, nunca por el Config Server).
      BANCO_GITHUB_CLIENT_ID: ${BANCO_GITHUB_CLIENT_ID:-sin-configurar}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GITHUB_CLIENT_SECRET: ${BANCO_GITHUB_CLIENT_SECRET:-sin-configurar}
      BANCO_GITHUB_VINCULOS: ${BANCO_GITHUB_VINCULOS:-}
    depends_on: *infraestructura
    ports:
      - "127.0.0.1:8081:8081"
    mem_limit: 448m

  # ------------------------------------------------------------------------------------- microservicios (red interna)
  clientes-service:
    <<: *java
    build: clientes-service
    image: banco-xyz/clientes-service:1.0.0
    environment:
      <<: *entorno
      BANCO_CANAL_AUTENTICACION_CLAVE: ${BANCO_CANAL_AUTENTICACION_CLAVE:-autenticacion-secreto-dev}
    depends_on:
      <<: *infraestructura
      db: *listo
      kafka: *listo
      banco-xyz-batch: { condition: service_completed_successfully }
    mem_limit: 448m

  cuentas-service:
    <<: *java
    build: cuentas-service
    image: banco-xyz/cuentas-service:1.0.0
    environment:
      <<: *entorno
      BANCO_OAUTH_CUENTAS_SECRETO: ${BANCO_OAUTH_CUENTAS_SECRETO:-cuentas-oauth-dev}
      BANCO_PEPPER_TARJETAS: ${BANCO_PEPPER_TARJETAS:-pepper-tarjetas-desarrollo-cambiar-en-produccion-01}
    depends_on:
      <<: *infraestructura
      db: *listo
      kafka: *listo
      banco-xyz-batch: { condition: service_completed_successfully }
    mem_limit: 448m

  pagos-service:
    <<: *java
    build: pagos-service
    image: banco-xyz/pagos-service:1.0.0
    environment:
      <<: *entorno
      BANCO_OAUTH_PAGOS_SECRETO: ${BANCO_OAUTH_PAGOS_SECRETO:-pagos-oauth-dev}
    depends_on:
      <<: *infraestructura
      db: *listo
      kafka: *listo
    mem_limit: 448m

  # ------------------------------------------------------------------------------------------- BFF: un canal cada uno
  bff-web:
    <<: *java
    build: bff-web
    image: banco-xyz/bff-web:1.0.0
    environment:
      <<: *entorno
      BANCO_OAUTH_BFF_WEB_SECRETO: ${BANCO_OAUTH_BFF_WEB_SECRETO:-bff-web-secreto-dev}
      # El cliente OAuth de Spring Security llama a banco-auth con el TLS por defecto de la JVM: se le da la CA del banco.
      JAVA_TOOL_OPTIONS: >-
        -XX:MaxRAMPercentage=60 -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError
        -Djavax.net.ssl.trustStore=/certificados/ca/truststore.p12 -Djavax.net.ssl.trustStoreType=PKCS12
        -Djavax.net.ssl.trustStorePassword=${BANCO_ALMACEN_CLAVE:-almacen-dev}
    depends_on:
      <<: *infraestructura
      banco-auth: *listo
    ports:
      - "127.0.0.1:8090:8090"
    mem_limit: 448m

  bff-movil:
    <<: *java
    build: bff-movil
    image: banco-xyz/bff-movil:1.0.0
    environment:
      <<: *entorno
    depends_on:
      <<: *infraestructura
      banco-auth: *listo
    ports:
      - "127.0.0.1:8091:8091"
    mem_limit: 448m

  bff-cajero:
    <<: *java
    build: bff-cajero
    image: banco-xyz/bff-cajero:1.0.0
    environment:
      <<: *entorno
      BANCO_OAUTH_BFF_CAJERO_SECRETO: ${BANCO_OAUTH_BFF_CAJERO_SECRETO:-bff-cajero-oauth-dev}
    depends_on:
      <<: *infraestructura
      banco-auth: *listo
    ports:
      - "127.0.0.1:8083:8083"
    mem_limit: 448m

networks:
  banco:
    name: banco-xyz

volumes:
  certificados:
  datos:
  kafka:
  salida-batch:
