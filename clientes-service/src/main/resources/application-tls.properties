# ---------------------------------------------------------------------------------------------------------------------
# Perfil tls (activo por defecto): HTTPS con el certificado del servicio y mTLS opcional (banco-auth lo presenta).
# Los archivos los genera la imagen pki del compose. En produccion vienen de la PKI del banco o de un gestor de secretos,
# montados con la misma estructura en BANCO_CERTIFICADOS.
# ---------------------------------------------------------------------------------------------------------------------
banco.certificados=${BANCO_CERTIFICADOS:certificados}

server.ssl.bundle=servidor
# want y no need: la conexion se abre sin certificado (los BFF entran con token), pero FiltroCertificadoDeServicio lo
# exige en /api/v1/autenticacion y responde un ProblemDetail en vez de cortar el handshake.
server.ssl.client-auth=want
server.http2.enabled=true

spring.ssl.bundle.pem.servidor.keystore.certificate=file:${banco.certificados}/servicios/clientes-service.crt
spring.ssl.bundle.pem.servidor.keystore.private-key=file:${banco.certificados}/servicios/clientes-service.key
# Unica confianza para los certificados de cliente: la CA del banco, no el almacen de CA publicas de Java.
spring.ssl.bundle.pem.servidor.truststore.certificate=file:${banco.certificados}/ca/ca.crt
spring.ssl.bundle.pem.servidor.options.enabled-protocols=TLSv1.3,TLSv1.2
spring.ssl.bundle.pem.servidor.options.ciphers=TLS_AES_256_GCM_SHA384,TLS_AES_128_GCM_SHA256,TLS_CHACHA20_POLY1305_SHA256,\
  TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256

# Confianza en la CA del banco para leer el JWK Set de banco-auth (bundle "confianza": solo truststore).
spring.ssl.bundle.pem.confianza.truststore.certificate=file:${banco.certificados}/ca/ca.crt
