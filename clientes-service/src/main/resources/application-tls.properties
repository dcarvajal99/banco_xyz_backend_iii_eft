# ---------------------------------------------------------------------------
# Perfil tls (activo por defecto): HTTPS con el certificado del core y mTLS para los BFF.
# Los archivos los genera scripts/generar_certificados.sh (PKI de desarrollo). En produccion vienen de la PKI del
# banco o de un gestor de secretos, montados con la misma estructura en BANCO_CERTIFICADOS.
# ---------------------------------------------------------------------------
banco.certificados=${BANCO_CERTIFICADOS:certificados}

server.ssl.bundle=servidor
# want y no need: la conexion TLS se abre sin certificado (Swagger, contrato), pero FiltroCertificadoDeCanal lo exige
# en /api/** y responde un ProblemDetail explicando el rechazo en vez de cortar el handshake.
server.ssl.client-auth=want
server.http2.enabled=true

spring.ssl.bundle.pem.servidor.keystore.certificate=file:${banco.certificados}/servicios/banco-core-api.crt
spring.ssl.bundle.pem.servidor.keystore.private-key=file:${banco.certificados}/servicios/banco-core-api.key
# Unica confianza para los certificados de cliente: la CA del banco, no el almacen de CA publicas de Java.
spring.ssl.bundle.pem.servidor.truststore.certificate=file:${banco.certificados}/ca/ca.crt
# TLS 1.3 y 1.2 con suites AEAD y ECDHE (secreto perfecto hacia adelante). TLS 1.0/1.1 y CBC quedan fuera.
spring.ssl.bundle.pem.servidor.options.enabled-protocols=TLSv1.3,TLSv1.2
spring.ssl.bundle.pem.servidor.options.ciphers=TLS_AES_256_GCM_SHA384,TLS_AES_128_GCM_SHA256,TLS_CHACHA20_POLY1305_SHA256,\
  TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256

# Operacion (health y metricas) en un puerto aparte, solo en loopback y sin TLS: no se publica hacia afuera.
management.server.port=9080
management.server.address=127.0.0.1
management.server.ssl.enabled=false
management.endpoints.web.exposure.include=health,metrics,circuitbreakers,circuitbreakerevents,retries,retryevents

# Confianza en la CA del banco para leer el JWK Set de banco-auth (bundle "confianza": solo truststore).
spring.ssl.bundle.pem.confianza.truststore.certificate=file:${banco.certificados}/ca/ca.crt
