spring.application.name=clientes-service
# Lo que comparte el ecosistema y lo propio de este servicio (puertos de negocio y de operacion, Eureka, Resilience4j,
# emisor de los tokens) lo entrega el Config Server: banco-xyz-cloud/configuracion/{application,clientes-service}.properties
# y el perfil de entorno (nube). Este archivo solo trae lo que el servicio necesita para encontrar al Config Server y
# los valores de su propio dominio.
spring.config.import=optional:configserver:${BANCO_CONFIG_SERVER:https://localhost:8888}
# En el compose (BANCO_CONFIG_FAIL_FAST=true) el servicio NO arranca si el Config Server lo rechaza: no corre con
# valores incompletos.
spring.cloud.config.fail-fast=${BANCO_CONFIG_FAIL_FAST:false}
spring.cloud.config.username=${BANCO_CONFIG_USUARIO:configuracion}
spring.cloud.config.password=${BANCO_CONFIG_CLAVE:config-secreto-dev}
spring.cloud.config.tls.enabled=true
spring.cloud.config.tls.trust-store=file:${BANCO_CERTIFICADOS:certificados}/ca/truststore.p12
spring.cloud.config.tls.trust-store-password=${BANCO_ALMACEN_CLAVE:almacen-dev}
spring.cloud.config.tls.key-store=file:${BANCO_CERTIFICADOS:certificados}/servicios/clientes-service.p12
spring.cloud.config.tls.key-store-password=${BANCO_ALMACEN_CLAVE:almacen-dev}
spring.cloud.config.tls.key-password=${BANCO_ALMACEN_CLAVE:almacen-dev}
# HTTPS vive en el perfil tls (application-tls.properties), activo si no se elige otro. Las pruebas usan el perfil prueba.
spring.profiles.default=tls

# ---------------------------------------------------------------------------------------------------------------------
# Datos: esquema propio "clientes" (Flyway). Lee, sin escribir, migracion.cliente_migrado (el maestro del batch).
# ---------------------------------------------------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5439/banco_xyz
spring.datasource.username=${BANCO_DB_USUARIO:banco}
spring.datasource.password=${BANCO_DB_CLAVE:banco123}
spring.datasource.hikari.maximum-pool-size=15
spring.flyway.schemas=clientes
spring.flyway.default-schema=clientes
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true
spring.jackson.serialization.write-dates-as-timestamps=false
springdoc.swagger-ui.path=/swagger-ui.html

# ---------------------------------------------------------------------------------------------------------------------
# Dominio
# ---------------------------------------------------------------------------------------------------------------------
banco.clientes.zona-horaria=America/Santiago
banco.clientes.sincronizar-al-iniciar=true
# banco-auth es el unico que verifica claves aqui (Basic + su certificado). Valor de desarrollo: en el compose llega por
# variable de entorno.
banco.clientes.canal-autenticacion.usuario=banco-auth
banco.clientes.canal-autenticacion.clave=${BANCO_CANAL_AUTENTICACION_CLAVE:autenticacion-secreto-dev}
# Costo BCrypt de las claves de usuario. Las pruebas lo bajan a 4.
banco.clientes.seguridad.bcrypt-fuerza=10
# Usuarios de demostracion que se crean al copiar el maestro (documentados en el README).
banco.clientes.datos-demo.habilitados=true
banco.clientes.datos-demo.clave-clientes=${BANCO_DEMO_CLAVE_CLIENTES:Cliente2026!}
banco.clientes.datos-demo.clave-ejecutivo=${BANCO_DEMO_CLAVE_EJECUTIVO:Ejecutivo2026!}

# Kafka: solo produce alertas de seguridad (outbox). Serializadores de texto: el acuerdo entre servicios es el JSON.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=2000
spring.kafka.producer.properties.request.timeout.ms=2000
spring.kafka.producer.properties.delivery.timeout.ms=5000
banco.outbox.intervalo-ms=500

logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5p) %clr([%-15.15t]){faint} %clr([%X{correlacion:-}]){magenta} %clr(%logger{0}){cyan} - %m%n
logging.level.org.hibernate.orm.deprecation=ERROR
