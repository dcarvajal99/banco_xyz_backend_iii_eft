spring.application.name=banco-core-api
# Config Server es opcional para que las pruebas unitarias y el desarrollo aislado sigan funcionando.
# Cuando el ecosistema esta arriba, esta importacion tiene precedencia sobre este archivo local.
# Semana 7: el Config Server responde solo por HTTPS y exige usuario y clave (Basic) mas el certificado del servicio.
spring.config.import=optional:configserver:${BANCO_CONFIG_SERVER:https://localhost:8888}
# Con el ecosistema arriba (scripts/levantar_servicios.sh exporta BANCO_CONFIG_FAIL_FAST=true) el servicio NO arranca si el
# Config Server lo rechaza: sin esto, una clave o un certificado mal puesto lo dejaria corriendo con los valores locales.
spring.cloud.config.fail-fast=${BANCO_CONFIG_FAIL_FAST:false}
spring.cloud.config.username=${BANCO_CONFIG_USUARIO:configuracion}
spring.cloud.config.password=${BANCO_CONFIG_CLAVE:config-secreto-dev}
spring.cloud.config.tls.enabled=true
spring.cloud.config.tls.trust-store=file:${BANCO_CERTIFICADOS:certificados}/ca/truststore.p12
spring.cloud.config.tls.trust-store-password=${BANCO_ALMACEN_CLAVE:almacen-dev}
spring.cloud.config.tls.key-store=file:${BANCO_CERTIFICADOS:certificados}/servicios/banco-core-api.p12
spring.cloud.config.tls.key-store-password=${BANCO_ALMACEN_CLAVE:almacen-dev}
spring.cloud.config.tls.key-password=${BANCO_ALMACEN_CLAVE:almacen-dev}
server.port=8080
# HTTPS y mTLS viven en el perfil tls (application-tls.properties), activo si no se elige otro perfil.
# Las pruebas usan el perfil prueba y crean sus propios certificados.
spring.profiles.default=tls

# ---------------------------------------------------------------------------
# Base de la semana 7 (PostgreSQL en Docker, puerto 5439). Esquemas que usa el core:
#   public -> resultado de la migracion (volcado del batch); el core solo lo LEE (cierres publicados).
#   core   -> lo escribe el core con Flyway: cuentas, tarjetas, operaciones, reservas de la saga y outbox.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5439/banco_xyz
spring.datasource.username=${BANCO_DB_USUARIO:banco}
spring.datasource.password=${BANCO_DB_CLAVE:banco123}
spring.datasource.hikari.maximum-pool-size=20
# Mas hilos que conexiones no acelera nada: esperarian la base. 100 hilos para 3 BFF con 20 conexiones.
server.tomcat.threads.max=100
# Hibernate 6.6 ignora el hint jakarta.persistence.lock.timeout: el limite de espera por el
# bloqueo de una cuenta se fija en la conexion. Pasados 3 s el retiro responde 503 CUENTA_OCUPADA
# sin descontar, en vez de quedar esperando hasta que el BFF corte por timeout.
spring.datasource.hikari.connection-init-sql=SET lock_timeout = '3s'

spring.flyway.schemas=core
spring.flyway.default-schema=core
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.mvc.problemdetails.enabled=true
spring.jackson.serialization.write-dates-as-timestamps=false

management.endpoints.web.exposure.include=health,info
springdoc.swagger-ui.path=/swagger-ui.html

# Registro HTTPS en Eureka. La salud se consulta por el puerto de operacion, que solo escucha en loopback.
# Dos nodos Eureka que se replican: si uno cae, el cliente sigue con el otro.
eureka.client.service-url.defaultZone=${BANCO_EUREKA:http://127.0.0.1:8761/eureka/,http://localhost:8762/eureka/}
eureka.instance.hostname=localhost
eureka.instance.secure-port-enabled=true
eureka.instance.non-secure-port-enabled=false
eureka.instance.secure-port=${server.port}
eureka.instance.health-check-url=http://127.0.0.1:${management.server.port:9080}/actuator/health
eureka.instance.status-page-url=https://localhost:${server.port}/swagger-ui.html

# ---------------------------------------------------------------------------
# Banco XYZ
# ---------------------------------------------------------------------------
banco.core.zona-horaria=America/Santiago
banco.core.sincronizar-al-iniciar=true

# Credenciales de servicio de cada BFF (valores de desarrollo: sobreescribir por variable de entorno).
banco.core.canales.web.clave=${BANCO_CANAL_WEB_CLAVE:web-secreto-dev}
banco.core.canales.movil.clave=${BANCO_CANAL_MOVIL_CLAVE:movil-secreto-dev}
banco.core.canales.cajero.clave=${BANCO_CANAL_CAJERO_CLAVE:cajero-secreto-dev}
banco.core.canales.autenticacion.clave=${BANCO_CANAL_AUTENTICACION_CLAVE:autenticacion-secreto-dev}

# transferencias-service no tiene clave: entra con un token OAuth 2.0 client_credentials de banco-auth (scope
# core.cuentas.leer) mas su certificado. Emisor, audiencia y JWK Set comunes (banco.jwt.*) llegan del Config Server.
banco.jwt.emisor=https://localhost:8081
banco.jwt.audiencia=banco-xyz
banco.jwt.jwk-set-uri=https://localhost:8081/oauth2/jwks
banco.jwt.cache-jwks=30s

banco.core.seguridad.pepper-tarjetas=${BANCO_PEPPER_TARJETAS:pepper-tarjetas-desarrollo-cambiar-en-produccion-01}
# Costo BCrypt de claves de usuario y PIN. Las pruebas lo bajan a 4 para no gastar minutos hasheando.
banco.core.seguridad.bcrypt-fuerza=10

# Credenciales de demostracion que se crean al sincronizar el cierre (documentadas en el README).
banco.core.datos-demo.habilitados=true
banco.core.datos-demo.clave-clientes=Cliente2026!
banco.core.datos-demo.clave-ejecutivo=Ejecutivo2026!
banco.core.datos-demo.pin=1234

banco.core.cajero.limite-diario=10000

# ---------------------------------------------------------------------------
# Semana 7: saga de transferencias sobre Kafka (el Config Server entrega lo comun; esto es el respaldo local).
# ---------------------------------------------------------------------------
spring.kafka.bootstrap-servers=${BANCO_KAFKA:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# acks=all + idempotencia: el broker confirma solo lo que quedo escrito, sin duplicar por reintentos del productor.
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=2000
spring.kafka.producer.properties.request.timeout.ms=2000
spring.kafka.producer.properties.delivery.timeout.ms=5000
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=record
# Un consumidor por particion (los topicos tienen 3).
spring.kafka.listener.concurrency=3
banco.kafka.particiones=3
banco.outbox.intervalo-ms=500

logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5p) %clr([%-15.15t]){faint} %clr([%X{correlacion:-}]){magenta} %clr(%logger{0}){cyan} - %m%n
logging.level.org.hibernate.orm.deprecation=ERROR

# Resilience4j: las politicas (circuito, reintento, bulkhead) las entrega el Config Server, por entorno
# (banco-xyz-cloud/configuracion). Este jar no trae politica propia.
