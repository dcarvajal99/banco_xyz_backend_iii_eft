# H2 en modo PostgreSQL: el mismo SQL de Flyway y del sincronizador corre en las pruebas y en PostgreSQL.
spring.datasource.url=jdbc:h2:mem:clientes;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;LOCK_TIMEOUT=3000;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
banco.clientes.sincronizar-al-iniciar=false
banco.clientes.seguridad.bcrypt-fuerza=4
logging.level.root=WARN
logging.level.com.bancoxyz=WARN
eureka.client.enabled=false
spring.cloud.config.enabled=false
spring.kafka.admin.auto-create=false
banco.outbox.publicar=false
# Lo que en el ecosistema entrega el Config Server.
banco.jwt.emisor=https://localhost:8081
banco.jwt.audiencia=banco-xyz
banco.jwt.jwk-set-uri=https://localhost:8081/oauth2/jwks
banco.jwt.cache-jwks=30s
banco.kafka.particiones=3
resilience4j.circuitbreaker.configs.publicacion-kafka.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.publicacion-kafka.sliding-window-size=4
resilience4j.circuitbreaker.configs.publicacion-kafka.minimum-number-of-calls=2
resilience4j.circuitbreaker.configs.publicacion-kafka.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.publicacion-kafka.wait-duration-in-open-state=10s
resilience4j.retry.configs.publicacion-kafka.max-attempts=3
resilience4j.retry.configs.publicacion-kafka.wait-duration=300ms
resilience4j.circuitbreaker.instances.kafka.base-config=publicacion-kafka
resilience4j.circuitbreaker.instances.kafka.record-exceptions=com.bancoxyz.clientes.outbox.ErrorDePublicacion
resilience4j.retry.instances.kafka.base-config=publicacion-kafka
resilience4j.retry.instances.kafka.retry-exceptions=com.bancoxyz.clientes.outbox.ErrorDePublicacion
