spring.datasource.url=jdbc:h2:mem:transferencias;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
eureka.client.enabled=false
spring.cloud.config.enabled=false
spring.kafka.listener.auto-startup=false
spring.kafka.admin.auto-create=false
banco.outbox.publicar=false
logging.level.root=WARN
logging.level.com.bancoxyz=WARN

# Copia de las politicas de Resilience4j del Config Server (configuracion/application.properties y
# configuracion/transferencias-service.properties): las pruebas corren sin Config Server.
# banco-xyz-cloud/scripts/verificar_coherencia.sh comprueba que sea identica a la central.
resilience4j.circuitbreaker.configs.http-interno.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.http-interno.sliding-window-size=6
resilience4j.circuitbreaker.configs.http-interno.minimum-number-of-calls=3
resilience4j.circuitbreaker.configs.http-interno.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.http-interno.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.http-interno.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.configs.http-interno.register-health-indicator=true
resilience4j.retry.configs.http-interno.max-attempts=2
resilience4j.retry.configs.http-interno.wait-duration=200ms
resilience4j.retry.configs.http-interno.retry-exceptions=org.springframework.web.client.ResourceAccessException
resilience4j.bulkhead.configs.http-interno.max-concurrent-calls=20
resilience4j.bulkhead.configs.http-interno.max-wait-duration=0ms
resilience4j.circuitbreaker.configs.publicacion-kafka.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.publicacion-kafka.sliding-window-size=4
resilience4j.circuitbreaker.configs.publicacion-kafka.minimum-number-of-calls=2
resilience4j.circuitbreaker.configs.publicacion-kafka.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.publicacion-kafka.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.publicacion-kafka.permitted-number-of-calls-in-half-open-state=1
resilience4j.circuitbreaker.configs.publicacion-kafka.register-health-indicator=true
resilience4j.retry.configs.publicacion-kafka.max-attempts=3
resilience4j.retry.configs.publicacion-kafka.wait-duration=300ms
resilience4j.circuitbreaker.instances.core.base-config=http-interno
resilience4j.retry.instances.core.base-config=http-interno
resilience4j.bulkhead.instances.core.base-config=http-interno
resilience4j.circuitbreaker.instances.core.ignore-exceptions=com.bancoxyz.transferencias.core.ErrorDeNegocioDelCore,io.github.resilience4j.bulkhead.BulkheadFullException
resilience4j.circuitbreaker.instances.kafka.base-config=publicacion-kafka
resilience4j.circuitbreaker.instances.kafka.record-exceptions=com.bancoxyz.transferencias.outbox.ErrorDePublicacion
resilience4j.retry.instances.kafka.base-config=publicacion-kafka
resilience4j.retry.instances.kafka.retry-exceptions=com.bancoxyz.transferencias.outbox.ErrorDePublicacion
