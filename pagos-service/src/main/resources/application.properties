spring.application.name=transferencias-service
# Config Server por HTTPS con usuario, clave y el certificado del servicio (opcional: arranca igual sin el).
spring.config.import=optional:configserver:${BANCO_CONFIG_SERVER:https://localhost:8888}
# Con el ecosistema arriba (scripts/levantar_servicios.sh exporta BANCO_CONFIG_FAIL_FAST=true) el servicio NO arranca si el
# Config Server lo rechaza: sin esto, una clave o un certificado mal puesto lo dejaria corriendo con los valores locales.
spring.cloud.config.fail-fast=${BANCO_CONFIG_FAIL_FAST:false}
spring.cloud.config.username=${BANCO_CONFIG_USUARIO:configuracion}
spring.cloud.config.password=${BANCO_CONFIG_CLAVE:config-secreto-dev}
spring.cloud.config.tls.enabled=true
spring.cloud.config.tls.trust-store=file:${BANCO_CERTIFICADOS:certificados}/ca/truststore.p12
spring.cloud.config.tls.trust-store-password=${BANCO_ALMACEN_CLAVE:almacen-dev}
spring.cloud.config.tls.key-store=file:${BANCO_CERTIFICADOS:certificados}/servicios/transferencias-service.p12
spring.cloud.config.tls.key-store-password=${BANCO_ALMACEN_CLAVE:almacen-dev}
spring.cloud.config.tls.key-password=${BANCO_ALMACEN_CLAVE:almacen-dev}
server.port=8082
spring.profiles.default=tls

# Base: esquema propio "transferencias" en la base de la semana 7. Nadie mas escribe aqui.
spring.datasource.url=jdbc:postgresql://localhost:5439/banco_xyz
spring.datasource.username=${BANCO_DB_USUARIO:banco}
spring.datasource.password=${BANCO_DB_CLAVE:banco123}
spring.flyway.schemas=transferencias
spring.flyway.default-schema=transferencias
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT de banco-auth (RS256, JWK Set). Los valores comunes llegan del Config Server; esto es el respaldo local.
banco.jwt.emisor=https://localhost:8081
banco.jwt.audiencia=banco-xyz
banco.jwt.jwk-set-uri=https://localhost:8081/oauth2/jwks
banco.jwt.cache-jwks=30s

# Core: URL fija por defecto; el Config Server activa el descubrimiento por Eureka.
banco.core.url=https://localhost:8080/api/v1
banco.core.descubrimiento=false
# Credencial hacia el core: token OAuth 2.0 client_credentials de banco-auth (scope core.cuentas.leer), sin clave Basic.
# El secreto del cliente llega por variable de entorno; el endpoint de tokens, del Config Server (banco.jwt.token-uri).
spring.security.oauth2.client.registration.core.provider=banco-auth
spring.security.oauth2.client.registration.core.client-id=transferencias-service
spring.security.oauth2.client.registration.core.client-secret=${BANCO_OAUTH_TRANSFERENCIAS_SECRETO:transferencias-oauth-dev}
spring.security.oauth2.client.registration.core.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.core.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.core.scope=core.cuentas.leer
spring.security.oauth2.client.provider.banco-auth.token-uri=${banco.jwt.token-uri:https://localhost:8081/oauth2/token}
spring.http.client.connect-timeout=1s
spring.http.client.read-timeout=3s

# Un solo mecanismo de reintento: el @Retry de Resilience4j. spring-kafka trae spring-retry y con el Spring Cloud
# LoadBalancer activaria ademas su propio reintento (RetryLoadBalancerInterceptor), que se sumaria a este.
spring.cloud.loadbalancer.retry.enabled=false

spring.kafka.bootstrap-servers=${BANCO_KAFKA:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=2000
spring.kafka.producer.properties.request.timeout.ms=2000
spring.kafka.producer.properties.delivery.timeout.ms=5000
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=record
spring.kafka.listener.concurrency=3
banco.kafka.particiones=3
banco.outbox.intervalo-ms=500

# Registro HTTPS en los dos nodos Eureka; el health se consulta por el puerto de operacion.
eureka.client.service-url.defaultZone=${BANCO_EUREKA:http://127.0.0.1:8761/eureka/,http://localhost:8762/eureka/}
eureka.instance.hostname=localhost
eureka.instance.secure-port-enabled=true
eureka.instance.non-secure-port-enabled=false
eureka.instance.secure-port=${server.port}
eureka.instance.health-check-url=http://127.0.0.1:${management.server.port:9082}/actuator/health

management.endpoints.web.exposure.include=health,info,circuitbreakers,circuitbreakerevents,retries,retryevents,bulkheads,bulkheadevents
logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5p) %clr([%-15.15t]){faint} %clr(%logger{0}){cyan} - %m%n

# Resilience4j: las politicas (circuito, reintento, bulkhead) las entrega el Config Server, por entorno
# (banco-xyz-cloud/configuracion). Este jar no trae politica propia.
