spring.application.name=pagos-service
# Lo que comparte el ecosistema y lo propio de este servicio (puertos de negocio y de operacion, Eureka, Resilience4j,
# emisor de los tokens) lo entrega el Config Server: banco-xyz-cloud/configuracion/{application,pagos-service}.properties
# y el perfil de entorno (nube). Este archivo solo trae lo que el servicio necesita para encontrar al Config Server y
# los valores de su propio dominio.
spring.config.import=optional:configserver:${BANCO_CONFIG_SERVER:https://localhost:8888}
# En el compose (BANCO_CONFIG_FAIL_FAST=true) el servicio NO arranca si el Config Server lo rechaza: no corre con
# valores incompletos.
spring.cloud.config.fail-fast=${BANCO_CONFIG_FAIL_FAST:false}
spring.cloud.config.username=${BANCO_CONFIG_USUARIO:configuracion}
spring.cloud.config.password=${BANCO_CONFIG_CLAVE:config-secreto-dev}
spring.cloud.config.tls.enabled=true
spring.cloud.config.tls.trust-store=file:${BANCO_CERTIFICADOS:certificados}/ca/truststore.p12
spring.cloud.config.tls.trust-store-password=${BANCO_ALMACEN_CLAVE:almacen-dev}
spring.cloud.config.tls.key-store=file:${BANCO_CERTIFICADOS:certificados}/servicios/pagos-service.p12
spring.cloud.config.tls.key-store-password=${BANCO_ALMACEN_CLAVE:almacen-dev}
spring.cloud.config.tls.key-password=${BANCO_ALMACEN_CLAVE:almacen-dev}
# HTTPS vive en el perfil tls (application-tls.properties), activo si no se elige otro. Las pruebas usan el perfil prueba.
spring.profiles.default=tls

# ---------------------------------------------------------------------------------------------------------------------
# Datos: esquema propio "pagos" (Flyway).
# ---------------------------------------------------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5439/banco_xyz
spring.datasource.username=${BANCO_DB_USUARIO:banco}
spring.datasource.password=${BANCO_DB_CLAVE:banco123}
spring.datasource.hikari.maximum-pool-size=15
spring.flyway.schemas=pagos
spring.flyway.default-schema=pagos
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true
spring.jackson.serialization.write-dates-as-timestamps=false
springdoc.swagger-ui.path=/swagger-ui.html

# ---------------------------------------------------------------------------------------------------------------------
# Dominio
# ---------------------------------------------------------------------------------------------------------------------
banco.pagos.zona-horaria=America/Santiago
banco.pagos.cuentas-url=https://localhost:8100/api/v1
banco.pagos.relevos-permitidos=bff-web,bff-movil
# Reglas de fraude (respaldo local; las vigentes las entrega el Config Server).
banco.pagos.fraude.monto-maximo=5000000
banco.pagos.fraude.cuentas-en-observacion=

# Token propio para prevalidar en cuentas-service (client_credentials, scope cuentas.leer).
spring.security.oauth2.client.registration.cuentas.provider=banco-auth
spring.security.oauth2.client.registration.cuentas.client-id=pagos-service
spring.security.oauth2.client.registration.cuentas.client-secret=${BANCO_OAUTH_PAGOS_SECRETO:pagos-oauth-dev}
spring.security.oauth2.client.registration.cuentas.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.cuentas.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.cuentas.scope=cuentas.leer
spring.security.oauth2.client.provider.banco-auth.token-uri=${banco.jwt.token-uri:https://localhost:8081/oauth2/token}

# Kafka: produce pagos.solicitados y seguridad.alertas (outbox); consume cuentas.movimientos.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=2000
spring.kafka.producer.properties.request.timeout.ms=2000
spring.kafka.producer.properties.delivery.timeout.ms=5000
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=record
spring.kafka.listener.concurrency=3
banco.outbox.intervalo-ms=500

logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5p) %clr([%-15.15t]){faint} %clr([%X{correlacion:-}]){magenta} %clr(%logger{0}){cyan} - %m%n
logging.level.org.hibernate.orm.deprecation=ERROR
