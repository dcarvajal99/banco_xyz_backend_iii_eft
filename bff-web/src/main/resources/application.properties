spring.application.name=bff-web
# Puertos, Eureka, management y Resilience4j los entrega el Config Server (configuracion/{application,bff-web}.properties).
spring.config.import=optional:configserver:${BANCO_CONFIG_SERVER:https://localhost:8888}
spring.cloud.config.fail-fast=${BANCO_CONFIG_FAIL_FAST:false}
spring.cloud.config.username=${BANCO_CONFIG_USUARIO:configuracion}
spring.cloud.config.password=${BANCO_CONFIG_CLAVE:config-secreto-dev}
spring.cloud.config.tls.enabled=true
spring.cloud.config.tls.trust-store=file:${BANCO_CERTIFICADOS:certificados}/ca/truststore.p12
spring.cloud.config.tls.trust-store-password=${BANCO_ALMACEN_CLAVE:almacen-dev}
spring.cloud.config.tls.key-store=file:${BANCO_CERTIFICADOS:certificados}/servicios/bff-web.p12
spring.cloud.config.tls.key-store-password=${BANCO_ALMACEN_CLAVE:almacen-dev}
spring.cloud.config.tls.key-password=${BANCO_ALMACEN_CLAVE:almacen-dev}
spring.profiles.default=tls

# ---------------------------------------------------------------------------------------------------------------------
# Login con banco-auth: authorization_code + PKCE, cliente confidencial bff-web (el secreto llega por variable de entorno).
#   authorization-uri: la ve el NAVEGADOR (banco-auth publicado en el equipo).
#   token-uri y jwk-set-uri: las usa el BFF por la red interna (las ajusta el perfil nube del Config Server).
# ---------------------------------------------------------------------------------------------------------------------
spring.security.oauth2.client.registration.banco-auth.client-id=bff-web
spring.security.oauth2.client.registration.banco-auth.client-secret=${BANCO_OAUTH_BFF_WEB_SECRETO:bff-web-secreto-dev}
spring.security.oauth2.client.registration.banco-auth.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.banco-auth.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.banco-auth.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.banco-auth.scope=openid,profile,cuentas.leer,cuentas.administrar,clientes.leer,clientes.perfil,clientes.administrar,pagos.escribir,pagos.leer,reportes.leer
spring.security.oauth2.client.registration.banco-auth.client-name=Banco XYZ
spring.security.oauth2.client.provider.banco-auth.authorization-uri=https://localhost:8081/oauth2/authorize
spring.security.oauth2.client.provider.banco-auth.token-uri=${banco.jwt.token-uri:https://localhost:8081/oauth2/token}
spring.security.oauth2.client.provider.banco-auth.jwk-set-uri=${banco.jwt.jwk-set-uri:https://localhost:8081/oauth2/jwks}
spring.security.oauth2.client.provider.banco-auth.user-name-attribute=sub

# Sesion: cookie HttpOnly, Secure y SameSite=Lax con nombre propio (en localhost las cookies no distinguen puerto y
# chocarian con la del login de banco-auth). 30 minutos de inactividad.
server.servlet.session.cookie.name=BFF_WEB_SESION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

banco.web.cuentas-url=https://localhost:8100/api/v1
banco.web.clientes-url=https://localhost:8101/api/v1
banco.web.pagos-url=https://localhost:8102/api/v1
banco.web.url-tras-salir=/

# Los circuitos corren en el hilo de la solicitud (donde estan la sesion, el token del usuario y el id de correlacion):
# sin TimeLimiter, sin pool de hilos y con bulkhead de semaforo (cualquiera de los otros ejecuta la llamada en otro hilo).
spring.cloud.circuitbreaker.resilience4j.disable-time-limiter=true
spring.cloud.circuitbreaker.resilience4j.enable-semaphore-default-bulkhead=true
spring.cloud.circuitbreaker.resilience4j.disable-thread-pool=true
spring.http.client.connect-timeout=1s
spring.http.client.read-timeout=4s
spring.jackson.serialization.write-dates-as-timestamps=false
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript
springdoc.swagger-ui.path=/swagger-ui.html
logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5p) %clr([%-15.15t]){faint} %clr([%X{correlacion:-}]){magenta} %clr(%logger{0}){cyan} - %m%n
