spring.application.name=bff-web
spring.config.import=optional:configserver:${BANCO_CONFIG_SERVER:http://127.0.0.1:8888}
server.port=8081
# HTTPS y mTLS hacia el core viven en el perfil tls (application-tls.properties), activo si no se elige otro.
# Las pruebas usan el perfil prueba.
spring.profiles.default=tls

# Direccion del core. Por defecto una URL fija (pruebas y arranque sin ecosistema). En el ecosistema el Config Server
# activa el descubrimiento y cambia la URL por el nombre del servicio: https://banco-core-api/api/v1, que el cliente
# resuelve en Eureka en cada llamada (config/DescubrimientoDelCore).
banco.core.url=https://localhost:8080/api/v1
banco.core.descubrimiento=false
banco.core.usuario=bff-web
banco.core.clave=${BANCO_CORE_CLAVE:web-secreto-dev}
spring.http.client.connect-timeout=1s
spring.http.client.read-timeout=5s
# Politica del circuito core. Rige la que entrega el Config Server (banco-xyz-cloud/configuracion/bff-web.properties);
# esta es su copia de respaldo, para que el BFF arranque protegido si el Config Server no responde. Deben decir lo
# mismo: lo comprueba banco-xyz-cloud/scripts/verificar_coherencia.sh.
resilience4j.circuitbreaker.instances.core.register-health-indicator=true
resilience4j.circuitbreaker.instances.core.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.core.sliding-window-size=6
resilience4j.circuitbreaker.instances.core.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.core.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.core.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.core.permitted-number-of-calls-in-half-open-state=2
# Los errores de negocio (4xx) y CUENTA_OCUPADA no abren el circuito; cualquier otro 5xx del core si cuenta.
resilience4j.circuitbreaker.instances.core.ignore-exception-predicate=com.bancoxyz.bff.web.core.ErrorDeNegocioDelCore
# Limite de tiempo del circuito por encima del read-timeout: quien corta es el cliente HTTP.
resilience4j.timelimiter.instances.core.timeout-duration=6s

# ---------------------------------------------------------------------------
# Sesion del navegador: la identidad vive en el servidor; el navegador solo tiene
# una cookie HttpOnly que JavaScript no puede leer.
# ---------------------------------------------------------------------------
server.servlet.session.cookie.name=BFFWEB_SESION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
# Secure: la cookie solo viaja por HTTPS (todos los servicios corren con TLS).
server.servlet.session.cookie.secure=true
server.servlet.session.timeout=15m

# ---------------------------------------------------------------------------
# Agregador del panel: llamadas al core en paralelo. El timeout total se alinea con el
# read-timeout del cliente HTTP: un timeout mas corto no libera el hilo que sigue esperando.
# ---------------------------------------------------------------------------
banco.web.agregador.hilos=8
# Sin cola: una tarea que no encuentra hilo libre corre en el hilo de la solicitud en vez de esperar detras de
# las tareas de otros usuarios (y nunca se rechaza).
banco.web.agregador.cola=0
banco.web.agregador.timeout-segundos=6

spring.jackson.serialization.write-dates-as-timestamps=false

# ---------------------------------------------------------------------------
# Optimizacion del canal navegador: el panel y las paginas son JSON de varios KB y el navegador acepta gzip.
# Desde 1 KB: el token CSRF (GET /web/api/csrf, ~80 bytes) nunca va comprimido, lo que evita BREACH sobre el unico
# secreto que viaja en un cuerpo. Sin ETag: los datos bancarios salen con Cache-Control no-store, el navegador no los
# guarda en disco y un ETag no tendria contra que validarse.
# ---------------------------------------------------------------------------
server.compression.enabled=true
server.compression.mime-types=application/json,application/problem+json
server.compression.min-response-size=1024
# Hilos de Tomcat: el panel ocupa el hilo mientras espera al agregador. 100 alcanza para la consola y la banca web.
server.tomcat.threads.max=100
server.tomcat.threads.min-spare=10
management.endpoints.web.exposure.include=health,info,circuitbreakers,circuitbreakerevents
springdoc.swagger-ui.path=/swagger-ui.html

eureka.client.service-url.defaultZone=${BANCO_EUREKA:http://127.0.0.1:8761/eureka/}
eureka.instance.hostname=localhost
eureka.instance.secure-port-enabled=true
eureka.instance.non-secure-port-enabled=false
eureka.instance.secure-port=${server.port}
eureka.instance.health-check-url=http://127.0.0.1:${management.server.port:9081}/actuator/health
eureka.instance.status-page-url=https://localhost:${server.port}/swagger-ui.html

logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5p) %clr([%-15.15t]){faint} %clr([%X{correlacion:-}]){magenta} %clr(%logger{0}){cyan} - %m%n
