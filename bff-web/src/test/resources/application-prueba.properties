eureka.client.enabled=false
spring.cloud.config.enabled=false
logging.level.root=WARN

# Copia de la politica de los circuitos que entrega el Config Server (las pruebas corren sin el).
resilience4j.circuitbreaker.instances.cuentas.sliding-window-size=6
resilience4j.circuitbreaker.instances.cuentas.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.cuentas.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.cuentas.ignore-exceptions=com.bancoxyz.bff.web.error.ErrorDeServicio
