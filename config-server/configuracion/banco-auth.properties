# banco-auth: servidor de autorizacion OAuth 2.0 / OpenID Connect (Spring Authorization Server).
server.port=8081
management.server.port=9081
# Ademas de lo comun: claves (rotacion de la clave de firma, protegida con claves.administrar).
management.endpoints.web.exposure.include=health,info,prometheus,claves,circuitbreakers,circuitbreakerevents,retries,retryevents,bulkheads,bulkheadevents

# Vida del access token y periodo de gracia: una clave retirada sigue en el JWK Set hasta que vencen los tokens que firmo.
banco.auth.duracion-token=5m

# clientes-service se busca por nombre en Eureka (LoadBalancer) para verificar usuario y clave del formulario.
banco.clientes.url=https://clientes-service/api/v1
banco.clientes.descubrimiento=true

# Resilience4j: la llamada a clientes-service usa la politica compartida http-interno (application.properties).
resilience4j.circuitbreaker.instances.clientes.base-config=http-interno
resilience4j.retry.instances.clientes.base-config=http-interno
resilience4j.bulkhead.instances.clientes.base-config=http-interno
# Clave incorrecta o usuario bloqueado son respuestas validas: no abren el circuito. Tampoco el bulkhead lleno.
resilience4j.circuitbreaker.instances.clientes.ignore-exceptions=com.bancoxyz.auth.clientes.ErrorDeClientes,\
  io.github.resilience4j.bulkhead.BulkheadFullException

# -----------------------------------------------------------------------------------------------------------------------
# OAuth2 Client: GitHub (inicio de sesion con identidad federada: "Ingresar con GitHub" en el login de banco-auth)
# -----------------------------------------------------------------------------------------------------------------------
# El client-id de la aplicacion OAuth registrada en GitHub llega por variable de entorno (archivo .env del compose). El
# client-secret NUNCA pasa por el Config Server: banco-auth lo recibe directo de su entorno
# (SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GITHUB_CLIENT_SECRET, ver docker-compose.yaml).
spring.security.oauth2.client.registration.github.client-id=${BANCO_GITHUB_CLIENT_ID:sin-configurar}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.github.client-name=GitHub
# Solo entran cuentas de GitHub vinculadas a un cliente del banco: id numerico de GitHub (no el login, que se puede
# cambiar) = usuario del banco. clientes-service confirma en cada inicio de sesion que el usuario existe y no esta bloqueado.
# 113071563 = dcarvajal99
banco.auth.github.vinculos.113071563=diana.prince
