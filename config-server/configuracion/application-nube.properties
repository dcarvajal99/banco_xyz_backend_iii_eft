# Entorno "nube": el ecosistema completo en contenedores (docker-compose.yaml). Los servicios arrancan con el perfil
# nube y el Config Server les entrega esto encima de application.properties. Solo cambia lo propio del entorno.

# Direcciones dentro de la red de Docker (nombres de servicio del compose).
eureka.client.service-url.defaultZone=http://eureka-1:8761/eureka/,http://eureka-2:8762/eureka/
spring.kafka.bootstrap-servers=kafka:9092
banco.jwt.emisor=https://banco-auth:8081
banco.jwt.jwk-set-uri=https://banco-auth:8081/oauth2/jwks
banco.jwt.token-uri=https://banco-auth:8081/oauth2/token
# Base de datos: un PostgreSQL con un esquema por servicio (clientes, cuentas, pagos) mas migracion (batch).
spring.datasource.url=jdbc:postgresql://db:5432/banco_xyz
# Cada replica se registra con su IP: asi LoadBalancer reparte entre replicas de verdad (con el nombre del servicio todas
# tenian la misma URL y la conexion quedaba pegada a una). El id de instancia (HOSTNAME) las distingue en Eureka.
eureka.instance.prefer-ip-address=true

# Resilience4j en la nube: mas llamadas antes de decidir (una red compartida tiene fallas aisladas que no deben abrir el
# circuito), espera mas larga antes de probar, llamadas lentas cuentan como falla y reintentos con espera exponencial.
resilience4j.circuitbreaker.configs.http-interno.sliding-window-size=10
resilience4j.circuitbreaker.configs.http-interno.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.http-interno.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.configs.http-interno.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.http-interno.slow-call-duration-threshold=2s
resilience4j.circuitbreaker.configs.http-interno.slow-call-rate-threshold=80
resilience4j.retry.configs.http-interno.max-attempts=3
resilience4j.retry.configs.http-interno.wait-duration=300ms
resilience4j.retry.configs.http-interno.enable-exponential-backoff=true
resilience4j.retry.configs.http-interno.exponential-backoff-multiplier=2
resilience4j.bulkhead.configs.http-interno.max-concurrent-calls=25
resilience4j.circuitbreaker.configs.publicacion-kafka.sliding-window-size=6
resilience4j.circuitbreaker.configs.publicacion-kafka.minimum-number-of-calls=3
resilience4j.circuitbreaker.configs.publicacion-kafka.wait-duration-in-open-state=15s
resilience4j.retry.configs.publicacion-kafka.max-attempts=4
resilience4j.retry.configs.publicacion-kafka.wait-duration=500ms
