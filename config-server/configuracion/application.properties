# Configuracion COMUN a todos los servicios del ecosistema (la sirve el Config Server por HTTPS).
# Lo especifico de cada servicio va en <spring.application.name>.properties, en esta misma carpeta, y lo propio de un
# entorno en application-<entorno>.properties (application-nube.properties: el ecosistema en contenedores).
# Aqui no hay secretos: claves y credenciales llegan a cada servicio por variables de entorno.
banco.ecosistema.version=eft

# ---------------------------------------------------------------------------------------------------------------------
# Operacion (management): un puerto aparte por servicio (lo fija <servicio>.properties), HTTP, en TODAS las interfaces
# del contenedor (retroalimentacion S8: nada escucha solo en 127.0.0.1 dentro de un contenedor). La proteccion es la red:
# el puerto de operacion no se publica hacia afuera salvo en 127.0.0.1 del equipo (docker-compose.yaml).
# ---------------------------------------------------------------------------------------------------------------------
management.server.ssl.enabled=false
management.endpoints.web.exposure.include=health,info,prometheus,metrics,circuitbreakers,circuitbreakerevents,retries,retryevents,bulkheads
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
management.info.env.enabled=true

# ---------------------------------------------------------------------------------------------------------------------
# Descubrimiento: dos nodos Eureka que se replican; si uno cae, el cliente sigue con el otro.
# ---------------------------------------------------------------------------------------------------------------------
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/,http://localhost:8762/eureka/
eureka.client.healthcheck.enabled=true
# Cada cliente renueva su copia del catalogo cada 5 s y LoadBalancer la guarda 5 s (por defecto, 30 s y 35 s).
eureka.client.registry-fetch-interval-seconds=5
# El estado de salud se reenvia a Eureka cada 5 s (por defecto 30): una replica que arranca o vuelve recibe trafico en
# segundos. Al arrancar se registra DOWN un instante y sin esto quedaba 30 s invisible para los demas.
eureka.client.instance-info-replication-interval-seconds=5
eureka.client.initial-instance-info-replication-interval-seconds=5
spring.cloud.loadbalancer.cache.ttl=5s
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=15
# HTTPS en el puerto de negocio. Un id por replica (HOSTNAME = id del contenedor): con --scale cada una se ve aparte.
eureka.instance.secure-port-enabled=true
eureka.instance.non-secure-port-enabled=false
eureka.instance.secure-port=${server.port}
eureka.instance.instance-id=${spring.application.name}:${HOSTNAME:local}:${server.port}
# La salud se consulta en la IP de CADA replica por su puerto de operacion (antes 127.0.0.1, inalcanzable desde Eureka).
eureka.instance.health-check-url=http://${spring.cloud.client.ip-address}:${management.server.port}/actuator/health
eureka.instance.status-page-url=http://${spring.cloud.client.ip-address}:${management.server.port}/actuator/info
eureka.instance.metadata-map.replica=${HOSTNAME:local}

# Pool de conexiones a la base: cada replica mantiene solo 2 abiertas en reposo y crece hasta su maximo (en su jar) si
# hay carga. Asi escalar no agota las conexiones de PostgreSQL.
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=60000

# Kafka: el mismo broker para todos; los topicos se crean con 3 particiones.
spring.kafka.bootstrap-servers=localhost:9092
banco.kafka.particiones=3

# OAuth 2.0: banco-auth es el servidor de autorizacion. Los servidores de recursos validan la firma RS256 con el JWK Set
# (la clave cuyo kid trae el token), el emisor y la audiencia; los clientes de servicio piden su token en token-uri.
banco.jwt.emisor=https://localhost:8081
banco.jwt.audiencia=banco-xyz
banco.jwt.jwk-set-uri=https://localhost:8081/oauth2/jwks
banco.jwt.token-uri=https://localhost:8081/oauth2/token
# Copia del JWK Set: 30 s. Una clave retirada deja de aceptarse a lo sumo 30 s despues; una desconocida fuerza la consulta.
banco.jwt.cache-jwks=30s

# ---------------------------------------------------------------------------------------------------------------------
# Resilience4j: politicas COMPARTIDAS. Se definen una sola vez como "configs" y cada punto protegido de cada servicio
# las usa con base-config (ver <servicio>.properties). Los jar no traen politica propia: la reciben de aqui, y
# application-nube.properties ajusta los valores para el entorno en contenedores.
# ---------------------------------------------------------------------------------------------------------------------
# http-interno: llamadas HTTP entre servicios (BFF -> microservicios, banco-auth -> clientes, pagos -> cuentas, etc.).
#   Circuito: ventana de 6 llamadas, abre con 50 % de fallas (minimo 3), a los 10 s deja pasar 2 de prueba.
#   Reintento: solo un corte de conexion, una vez, a los 200 ms (un 4xx no se reintenta: la respuesta no va a cambiar).
#   Bulkhead: hasta 20 llamadas simultaneas por destino; la 21 no espera, va al fallback.
resilience4j.circuitbreaker.configs.http-interno.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.http-interno.sliding-window-size=6
resilience4j.circuitbreaker.configs.http-interno.minimum-number-of-calls=3
resilience4j.circuitbreaker.configs.http-interno.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.http-interno.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.http-interno.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.configs.http-interno.register-health-indicator=true
resilience4j.retry.configs.http-interno.max-attempts=2
resilience4j.retry.configs.http-interno.wait-duration=200ms
resilience4j.retry.configs.http-interno.retry-exceptions=org.springframework.web.client.ResourceAccessException
resilience4j.bulkhead.configs.http-interno.max-concurrent-calls=20
resilience4j.bulkhead.configs.http-interno.max-wait-duration=0ms
# publicacion-kafka: el publicador del outbox (decoradores programaticos en clientes, cuentas y pagos).
#   Reintento corto para un fallo pasajero; si Kafka sigue sin responder, el circuito abre 10 s y no se insiste.
resilience4j.circuitbreaker.configs.publicacion-kafka.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.publicacion-kafka.sliding-window-size=4
resilience4j.circuitbreaker.configs.publicacion-kafka.minimum-number-of-calls=2
resilience4j.circuitbreaker.configs.publicacion-kafka.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.publicacion-kafka.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.publicacion-kafka.permitted-number-of-calls-in-half-open-state=1
resilience4j.circuitbreaker.configs.publicacion-kafka.register-health-indicator=true
resilience4j.retry.configs.publicacion-kafka.max-attempts=3
resilience4j.retry.configs.publicacion-kafka.wait-duration=300ms

info.ecosistema.nombre=Banco XYZ en la nube
info.ecosistema.version=eft
