# bff-movil: canal de la app movil (tokens de banco-auth del cliente publico banca-movil; respuestas ligeras).
server.port=8091
management.server.port=9091

# cuentas-service y pagos-service por nombre en Eureka; el token del usuario se reenvia (token relay).
banco.core.url=https://cuentas-service/api/v1
banco.core.descubrimiento=true
banco.movil.pagos-url=https://pagos-service/api/v1

# Circuito core con la politica compartida http-interno. Los errores de negocio (4xx) no lo abren; el limite de tiempo
# queda sobre el read-timeout del cliente HTTP, que es quien corta primero.
resilience4j.circuitbreaker.instances.core.base-config=http-interno
resilience4j.circuitbreaker.instances.core.ignore-exception-predicate=com.bancoxyz.bff.movil.core.ErrorDeNegocioDelCore
resilience4j.timelimiter.instances.core.timeout-duration=4s
