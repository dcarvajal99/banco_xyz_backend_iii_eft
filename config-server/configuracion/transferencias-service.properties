info.app.nombre=transferencias-service
info.app.configuracion=centralizada
info.app.rol=inicio-de-la-saga

# El core se busca por nombre en Eureka (LoadBalancer) para prevalidar la cuenta de origen.
banco.core.url=https://banco-core-api/api/v1
banco.core.descubrimiento=true

# Resilience4j: la prevalidacion HTTP usa http-interno; la publicacion del outbox, publicacion-kafka.
resilience4j.circuitbreaker.instances.core.base-config=http-interno
resilience4j.retry.instances.core.base-config=http-interno
resilience4j.bulkhead.instances.core.base-config=http-interno
# Una cuenta ajena o inexistente (404) es una respuesta valida: no abre el circuito. Tampoco el bulkhead lleno: es
# exceso de llamadas propias, no una falla del core.
resilience4j.circuitbreaker.instances.core.ignore-exceptions=com.bancoxyz.transferencias.core.ErrorDeNegocioDelCore,\
  io.github.resilience4j.bulkhead.BulkheadFullException
resilience4j.circuitbreaker.instances.kafka.base-config=publicacion-kafka
resilience4j.circuitbreaker.instances.kafka.record-exceptions=com.bancoxyz.transferencias.outbox.ErrorDePublicacion
resilience4j.retry.instances.kafka.base-config=publicacion-kafka
resilience4j.retry.instances.kafka.retry-exceptions=com.bancoxyz.transferencias.outbox.ErrorDePublicacion
