# clientes-service: gestion de clientes (informacion personal, perfiles y credenciales).
# Puertos: negocio por HTTPS y operacion (health, metricas, circuitos) por HTTP, en todas las interfaces del contenedor.
server.port=8101
management.server.port=9101

# Resilience4j: el publicador del outbox de alertas de seguridad usa la politica compartida publicacion-kafka.
resilience4j.circuitbreaker.instances.kafka.base-config=publicacion-kafka
resilience4j.circuitbreaker.instances.kafka.record-exceptions=com.bancoxyz.clientes.outbox.ErrorDePublicacion
resilience4j.retry.instances.kafka.base-config=publicacion-kafka
resilience4j.retry.instances.kafka.retry-exceptions=com.bancoxyz.clientes.outbox.ErrorDePublicacion
