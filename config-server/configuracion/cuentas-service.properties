# cuentas-service: gestion de cuentas (apertura, cierre, mantenimiento), tarjetas, retiros y pagos aplicados.
server.port=8100
management.server.port=9100

# clientes-service por nombre en Eureka (LoadBalancer reparte entre sus instancias).
banco.descubrimiento=true
banco.cuentas.clientes.url=https://clientes-service/api/v1

# Resilience4j: llamada a clientes-service (politica http-interno) y publicador del outbox (publicacion-kafka).
resilience4j.circuitbreaker.instances.clientes.base-config=http-interno
resilience4j.retry.instances.clientes.base-config=http-interno
resilience4j.bulkhead.instances.clientes.base-config=http-interno
# Un 404 (cliente inexistente) es una respuesta valida: no cuenta como falla ni se reintenta.
resilience4j.circuitbreaker.instances.clientes.ignore-exceptions=com.bancoxyz.cuentas.error.ErrorDeNegocio
resilience4j.retry.instances.clientes.ignore-exceptions=com.bancoxyz.cuentas.error.ErrorDeNegocio
resilience4j.circuitbreaker.instances.kafka.base-config=publicacion-kafka
resilience4j.circuitbreaker.instances.kafka.record-exceptions=com.bancoxyz.cuentas.outbox.ErrorDePublicacion
resilience4j.retry.instances.kafka.base-config=publicacion-kafka
resilience4j.retry.instances.kafka.retry-exceptions=com.bancoxyz.cuentas.outbox.ErrorDePublicacion
