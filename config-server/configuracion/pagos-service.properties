# pagos-service: transferencias, depositos y pagos de servicios; reglas de fraude.
server.port=8102
management.server.port=9102

# cuentas-service por nombre en Eureka (LoadBalancer reparte entre sus instancias).
banco.descubrimiento=true
banco.pagos.cuentas-url=https://cuentas-service/api/v1

# Reglas de fraude: el area de riesgo las ajusta aqui, sin desplegar codigo (refresco al reiniciar el servicio).
banco.pagos.fraude.monto-maximo=5000000
banco.pagos.fraude.cuentas-en-observacion=104

# Resilience4j: prevalidacion en cuentas-service (http-interno) y publicador del outbox (publicacion-kafka).
resilience4j.circuitbreaker.instances.cuentas.base-config=http-interno
resilience4j.retry.instances.cuentas.base-config=http-interno
resilience4j.bulkhead.instances.cuentas.base-config=http-interno
# Un 404 (cuenta ajena o inexistente) es una respuesta valida: no abre el circuito ni se reintenta.
resilience4j.circuitbreaker.instances.cuentas.ignore-exceptions=com.bancoxyz.pagos.error.ErrorDeNegocio
resilience4j.retry.instances.cuentas.ignore-exceptions=com.bancoxyz.pagos.error.ErrorDeNegocio
resilience4j.circuitbreaker.instances.kafka.base-config=publicacion-kafka
resilience4j.circuitbreaker.instances.kafka.record-exceptions=com.bancoxyz.pagos.outbox.ErrorDePublicacion
resilience4j.retry.instances.kafka.base-config=publicacion-kafka
resilience4j.retry.instances.kafka.retry-exceptions=com.bancoxyz.pagos.outbox.ErrorDePublicacion
