# bff-web: canal web (navegador). Login con banco-auth, sesion HttpOnly + CSRF y token relay a los microservicios.
server.port=8090
management.server.port=9090

# Microservicios por nombre en Eureka (LoadBalancer reparte entre sus instancias).
banco.descubrimiento=true
banco.web.cuentas-url=https://cuentas-service/api/v1
banco.web.clientes-url=https://clientes-service/api/v1
banco.web.pagos-url=https://pagos-service/api/v1

# Un circuito por microservicio con la politica compartida http-interno. Un 4xx (error de negocio que se muestra al
# usuario) no es una falla del servicio: no abre el circuito.
resilience4j.circuitbreaker.instances.cuentas.base-config=http-interno
resilience4j.circuitbreaker.instances.clientes.base-config=http-interno
resilience4j.circuitbreaker.instances.pagos.base-config=http-interno
resilience4j.circuitbreaker.instances.cuentas.ignore-exceptions=com.bancoxyz.bff.web.error.ErrorDeServicio
resilience4j.circuitbreaker.instances.clientes.ignore-exceptions=com.bancoxyz.bff.web.error.ErrorDeServicio
resilience4j.circuitbreaker.instances.pagos.ignore-exceptions=com.bancoxyz.bff.web.error.ErrorDeServicio
