# bff-cajero: canal de cajeros automaticos (mTLS del terminal + firma HMAC + tarjeta/PIN).
server.port=8083
management.server.port=9083

# cuentas-service por nombre en Eureka; la credencial es el token client_credentials del BFF (scope cajero.operar).
banco.core.url=https://cuentas-service/api/v1
banco.core.descubrimiento=true

# Circuito core con la politica compartida http-interno. Los errores de negocio (4xx) no lo abren; el limite de tiempo
# queda sobre el read-timeout del cliente HTTP, que es quien corta primero.
resilience4j.circuitbreaker.instances.core.base-config=http-interno
resilience4j.circuitbreaker.instances.core.ignore-exception-predicate=com.bancoxyz.bff.cajero.core.ErrorDeNegocioDelCore
resilience4j.timelimiter.instances.core.timeout-duration=6s
