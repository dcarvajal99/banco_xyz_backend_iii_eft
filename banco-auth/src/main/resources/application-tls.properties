# Perfil tls (activo por defecto): HTTPS con el certificado de banco-auth; mTLS hacia el core con el mismo certificado.
banco.certificados=${BANCO_CERTIFICADOS:certificados}
server.ssl.bundle=servidor
server.http2.enabled=true
spring.ssl.bundle.pem.servidor.keystore.certificate=file:${banco.certificados}/servicios/banco-auth.crt
spring.ssl.bundle.pem.servidor.keystore.private-key=file:${banco.certificados}/servicios/banco-auth.key
spring.ssl.bundle.pem.servidor.options.enabled-protocols=TLSv1.3,TLSv1.2
spring.ssl.bundle.pem.cliente-core.keystore.certificate=file:${banco.certificados}/servicios/banco-auth.crt
spring.ssl.bundle.pem.cliente-core.keystore.private-key=file:${banco.certificados}/servicios/banco-auth.key
spring.ssl.bundle.pem.cliente-core.truststore.certificate=file:${banco.certificados}/ca/ca.crt
spring.http.client.ssl.bundle=cliente-core

# Operacion (health, claves, circuitos) en un puerto aparte, solo loopback y sin TLS.
management.server.port=9081
management.server.address=127.0.0.1
management.server.ssl.enabled=false
