spring.application.name=banco-auth
# Config Server por HTTPS con usuario, clave y el certificado de banco-auth (opcional: arranca igual sin el).
spring.config.import=optional:configserver:${BANCO_CONFIG_SERVER:https://localhost:8888}
# Con el ecosistema arriba (scripts/levantar_servicios.sh exporta BANCO_CONFIG_FAIL_FAST=true) el servicio NO arranca si el
# Config Server lo rechaza: sin esto, una clave o un certificado mal puesto lo dejaria corriendo con los valores locales.
spring.cloud.config.fail-fast=${BANCO_CONFIG_FAIL_FAST:false}
spring.cloud.config.username=${BANCO_CONFIG_USUARIO:configuracion}
spring.cloud.config.password=${BANCO_CONFIG_CLAVE:config-secreto-dev}
spring.cloud.config.tls.enabled=true
spring.cloud.config.tls.trust-store=file:${BANCO_CERTIFICADOS:certificados}/ca/truststore.p12
spring.cloud.config.tls.trust-store-password=${BANCO_ALMACEN_CLAVE:almacen-dev}
spring.cloud.config.tls.key-store=file:${BANCO_CERTIFICADOS:certificados}/servicios/banco-auth.p12
spring.cloud.config.tls.key-store-password=${BANCO_ALMACEN_CLAVE:almacen-dev}
spring.cloud.config.tls.key-password=${BANCO_ALMACEN_CLAVE:almacen-dev}
server.port=8081
# HTTPS en el perfil tls (application-tls.properties), activo si no se elige otro. Las pruebas usan el perfil prueba.
spring.profiles.default=tls

# Servidor de autorizacion OAuth 2.0. Emisor y audiencia comunes (banco.jwt.*) llegan del Config Server.
banco.auth.emisor=${banco.jwt.emisor:https://localhost:8081}
banco.auth.audiencia=${banco.jwt.audiencia:banco-xyz}
banco.auth.duracion-token=5m
banco.auth.duracion-refresco=60m
# Clientes registrados. Los secretos llegan por variable de entorno; los valores -dev son solo de desarrollo.
banco.auth.banca-web.id=banca-web
banco.auth.banca-web.secreto=${BANCO_OAUTH_BANCA_WEB_SECRETO:banca-web-secreto-dev}
banco.auth.banca-web.redirect-uris=http://127.0.0.1:8099/callback
banco.auth.transferencias.id=transferencias-service
banco.auth.transferencias.secreto=${BANCO_OAUTH_TRANSFERENCIAS_SECRETO:transferencias-oauth-dev}
banco.auth.operacion.id=operacion-banco
banco.auth.operacion.secreto=${BANCO_OAUTH_OPERACION_SECRETO:operacion-secreto-dev}

# Core: por defecto una URL fija; el Config Server activa el descubrimiento por Eureka.
banco.core.url=https://localhost:8080/api/v1
banco.core.descubrimiento=false
banco.core.usuario=banco-auth
banco.core.clave=${BANCO_CANAL_AUTENTICACION_CLAVE:autenticacion-secreto-dev}
spring.http.client.connect-timeout=1s
spring.http.client.read-timeout=3s

# Registro HTTPS en los dos nodos Eureka; el health se consulta por el puerto de operacion.
eureka.client.service-url.defaultZone=${BANCO_EUREKA:http://127.0.0.1:8761/eureka/,http://localhost:8762/eureka/}
eureka.instance.hostname=localhost
eureka.instance.secure-port-enabled=true
eureka.instance.non-secure-port-enabled=false
eureka.instance.secure-port=${server.port}
eureka.instance.health-check-url=http://127.0.0.1:${management.server.port:9081}/actuator/health

management.endpoints.web.exposure.include=health,info,claves,circuitbreakers,circuitbreakerevents,retries,retryevents,bulkheads,bulkheadevents
logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5p) %clr([%-15.15t]){faint} %clr(%logger{0}){cyan} - %m%n

# Resilience4j: las politicas (circuito, reintento, bulkhead) las entrega el Config Server, por entorno
# (banco-xyz-cloud/configuracion). Este jar no trae politica propia.

# Vinculos adicionales de GitHub para quien levanta el ecosistema (por ejemplo, para probar con su propia cuenta):
# BANCO_GITHUB_VINCULOS=id=usuario,id=usuario en el .env. Los vinculos del banco viven en el Config Server.
banco.auth.github.vinculos-adicionales=${BANCO_GITHUB_VINCULOS:}
