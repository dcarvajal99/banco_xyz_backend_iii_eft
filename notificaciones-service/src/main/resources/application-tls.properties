# ---------------------------------------------------------------------------
# Perfil tls (activo por defecto): HTTPS con el certificado del servicio, y confianza en la CA del banco para leer el
# JWK Set de banco-auth (bundle "confianza": solo truststore, este servicio no llama a nadie por mTLS).
# ---------------------------------------------------------------------------
banco.certificados=${BANCO_CERTIFICADOS:certificados}

server.ssl.bundle=servidor
server.http2.enabled=true

spring.ssl.bundle.pem.servidor.keystore.certificate=file:${banco.certificados}/servicios/notificaciones-service.crt
spring.ssl.bundle.pem.servidor.keystore.private-key=file:${banco.certificados}/servicios/notificaciones-service.key
spring.ssl.bundle.pem.servidor.options.enabled-protocols=TLSv1.3,TLSv1.2
spring.ssl.bundle.pem.servidor.options.ciphers=TLS_AES_256_GCM_SHA384,TLS_AES_128_GCM_SHA256,TLS_CHACHA20_POLY1305_SHA256,\
  TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256

spring.ssl.bundle.pem.confianza.truststore.certificate=file:${banco.certificados}/ca/ca.crt

# Operacion (health y metricas) en un puerto aparte, solo en loopback y sin TLS: no se publica hacia afuera.
management.server.port=9084
management.server.address=127.0.0.1
management.server.ssl.enabled=false
management.endpoints.web.exposure.include=health,info,metrics
