# Nodo 1 de Eureka. Replica con el nodo 2 (localhost:8762).
# Eureka descarta como "yo mismo" a un peer con su mismo nombre de host: por eso el nodo 1 se anuncia como 127.0.0.1 y
# el nodo 2 como localhost. Los dos nombres llegan a la misma maquina y son distintos para Eureka.
server.port=8761
eureka.instance.hostname=127.0.0.1
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8762/eureka/
