# Nodo 1 de Eureka en el entorno nube (docker-compose): se llama eureka-1 y replica con eureka-2.
# En Docker cada nodo tiene su propio nombre de red, asi que no hace falta mezclar 127.0.0.1 y localhost.
server.port=8761
server.address=0.0.0.0
eureka.instance.hostname=eureka-1
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://eureka-2:8762/eureka/
